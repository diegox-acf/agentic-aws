`iss`,\n   `client_id`, `token_use`, `exp`.\n\n5. **Security review** of the whole flow:\n\n   ```\n   > Use ecc:security-reviewer on the Cognito, http-api changes and apps/p2-web auth code.\n   > Check: token storage, redirect URI allow-list, audience validation, CORS with credentials,\n   > IDOR on GET /links/{code} (can I read stats for someone else's link?).\n   ```\n\n## Part B · CI/CD with GitHub OIDC\n\n### Architecture\n\n```\n GitHub Actions job ── requests OIDC token (aud: sts.amazonaws.com,\n       │                sub: repo:\u003cyou>/learn-aws:pull_request  or\n       │                     repo:\u003cyou>/learn-aws:environment:dev)\n       ▼\n AWS STS AssumeRoleWithWebIdentity\n       │ trust policy checks iss, aud, sub\n       ├─► role \"gha-plan\"  (ReadOnlyAccess + state bucket read + lock write)  ← PRs\n       └─► role \"gha-apply\" (deploy permissions)                               ← main, env \"dev\" with required reviewer\n```\n\n### Steps\n\n1. Create a **private** GitHub repo and push. Check nothing secret is committed first:\n\n   ```\n   > Use the ecc:security-reviewer agent to scan the repo for secrets, account IDs in\n   > places that will be public, and tfstate files before I push.\n   ```\n\n2. Unit `infra/live/global/github-oidc`: write this one yourself.\n\n   ```hcl\n   resource \"aws_iam_openid_connect_provider\" \"github\" {\n     url            = \"https://token.actions.githubusercontent.com\"\n     client_id_list = [\"sts.amazonaws.com\"]\n   }\n\n   data \"aws_iam_policy_document\" \"plan_trust\" {\n     statement {\n       actions = [\"sts:AssumeRoleWithWebIdentity\"]\n       principals {\n         type        = \"Federated\"\n         identifiers = [aws_iam_openid_connect_provider.github.arn]\n       }\n       condition {\n         test     = \"StringEquals\"\n         variable = \"token.actions.githubusercontent.com:aud\"\n         values   = [\"sts.amazonaws.com\"]\n       }\n       condition {\n         test     = \"StringLike\"\n         variable = \"token.actions.githubusercontent.com:sub\"\n         values   = [\"repo:${var.github_repo}:pull_request\"]\n       }\n     }\n   }\n   ```\n\n   The apply role's trust uses\n   `repo:${var.github_repo}:environment:dev` (StringEquals), so only jobs bound to the\n   protected `dev` environment can assume it.\n\n3. **Get a second opinion on the trust policies.** A wrong `sub` condition (e.g. `repo:*`)\n   lets any GitHub repo in the world assume your role:\n\n   ```\n   /ecc:santa-loop review infra/modules/github-oidc trust and permission policies\n   ```\n\n   Two independent reviewers must both approve.\n\n4. Workflows (`.github/workflows/`):\n   - `plan.yml` on `pull_request`: `permissions: id-token: write, contents: read`,\n     `aws-actions/configure-aws-credentials` with the plan role, install\n     Terraform + Terragrunt, build artifacts, `terragrunt run --all plan` for changed projects,\n     post the summary as a PR comment.\n   - `deploy.yml` on push to `main`: `environment: dev` (add yourself as a required reviewer\n     in GitHub settings), apply role, build, `terragrunt run --all apply`, then\n     P2's S3 sync + invalidation.\n\n   Ask Claude to write them using `ecc:deployment-patterns`, then review them yourself line by\n   line. You should be able to explain every permission.\n\n5. Use the PR flow for the rest of the tutorial:\n\n   ```\n   git switch -c feat/p4-auth\n   /ecc:prp-commit commit the auth changes\n   /ecc:pr\n   /ecc:review-pr            # multi-agent review of the PR\n   ```\n\n   Merge only when the plan comment and the review look right.\n\n6. Since `.github/` and CI config are agent-adjacent surfaces too, run `/ecc:security-scan`.\n\n---\n\n## Check yourself (no Claude)\n\n1. In the OIDC trust policy, what do `aud` and `sub` each protect against?\n2. Why is `ReadOnlyAccess` not quite enough for `terraform plan` with an S3 backend using native locking?\n3. Access token vs ID token: which goes to your API, and why?\n4. Where does the HTTP API JWT authorizer get the keys to verify signatures?\n5. What's an IDOR, and where could one exist in P1 now that links have owners?\n6. Why keep tokens in memory instead of `localStorage` in the SPA, and what does that cost you on page reload?\n\n## Stretch goals\n\n- Add a Cognito **pre-token-generation** Lambda that adds a `plan: free|pro` claim; enforce a links-per-user quota.\n- Restrict the apply role to a permissions boundary so CI can create roles only within that boundary.\n- Add `terragrunt hclfmt --check` and `tflint` to `plan.yml`. Fix what they find with `/ecc:build-fix`.\n- Add Checkov or Trivy IaC scanning and triage findings with `ecc:security-reviewer`.\n\n## Teardown\n\nCognito and IAM cost nothing idle. Keep them; P5/P6 deploy through the same pipeline.\n"},{"id":"m06","file":"06-p5-vpc-three-tier.md","title":"Module 6 · P5 · Classic three-tier in a VPC (Spring Boot)","md":"# Module 6 · P5 · Classic three-tier in a VPC (Spring Boot)\n\nServerless hid the network from you. Here you build it: a VPC across two AZs, a public\nload balancer, an Auto Scaling group of EC2 instances in private subnets, and PostgreSQL\non RDS. It's the architecture most companies still run, and the one most AWS design\nquestions are about.\n\n**Time:** 2–3 weekends, in **lab sessions** · **Cost:** ≈ $0.15/hour while deployed.\n**Deploy, learn, destroy the same day.** Left running for a month it's ≈ $100.\n\n## What you'll learn\n\n| AWS | ECC |\n|---|---|\n| VPC, CIDR planning, public vs private subnets, route tables, IGW | `ecc:architect` agent for design, `ecc:architecture-decision-records` for the egress decision |\n| Egress options: NAT Gateway vs NAT instance vs VPC endpoints, and their costs | `ecc:springboot-tdd` with Testcontainers (your Docker) |\n| Security groups referencing security groups; NACLs | `ecc:springboot-patterns`, `ecc:jpa-patterns`, `ecc:database-migrations` |\n| ALB, listeners, target groups, health checks | `ecc:java-reviewer` and `ecc:database-reviewer` agents |\n| Launch templates, IMDSv2, instance profiles, Auto Scaling target tracking | `/ecc:build-fix` (delegates to `java-build-resolver`) |\n| RDS PostgreSQL, subnet groups, parameter groups, backups, Multi-AZ vs read replicas | `/ecc:hookify` to warn when a lab stack is still deployed at session end |\n| Secrets Manager (RDS-managed master password), SSM Session Manager instead of SSH | |\n\n## Architecture\n\n```\n                         VPC 10.20.0.0/16  (us-east-1a, us-east-1b)\n ┌────────────────────────────────────────────────────────────────────────────────┐\n │  public  10.20.0.0/24  (a)              public  10.20.1.0/24  (b)              │\n │    ALB node ◄──────── internet (80/443) ────────► ALB node                     │\n │    NAT Gateway (lab: one AZ only)                                              │\n │          │ sg-alb → sg-app:8080                                                │\n │  private-app 10.20.10.0/24 (a)          private-app 10.20.11.0/24 (b)          │\n │    EC2 t4g.small (ASG)                    EC2 t4g.small (ASG)                  │\n │    Spring Boot :8080, IMDSv2, SSM agent   ...                                  │\n │          │ sg-app → sg-db:5432                                                 │\n │  private-db 10.20.20.0/24 (a)           private-db 10.20.21.0/24 (b)           │\n │    RDS PostgreSQL db.t4g.micro (single-AZ in lab)                              │\n │                                                                                │\n │  S3 gateway endpoint (free) ── artifact bucket (app jar)                       │\n └────────────────────────────────────────────────────────────────────────────────┘\n Secrets Manager: RDS-managed master secret    SSM Session Manager: shell access, no port 22\n```\n\n## Cost (lab mode, us-east-1, approximate)\n\n| Resource | Hourly | Notes |\n|---|---|---|\n| ALB | ~$0.023 + LCUs | Plus 2 public IPv4 addresses |\n| NAT Gateway (1 AZ) | ~$0.045 + $0.045/GB | The classic surprise bill. One AZ only in lab |\n| 2 × EC2 t4g.small | ~$0.034 | |\n| RDS db.t4g.micro, 20 GB gp3 | ~$0.016 | Single-AZ, no final snapshot |\n| Public IPv4 (ALB ×2, NAT EIP) | ~$0.015 | $0.005/h each |\n| Secrets Manager secret | ~$0.0006 | $0.40/month |\n| **Total** | **≈ $0.13–0.15/h** | 4-hour lab ≈ $0.60 |\n\n## Repo layout\n\n```\napps/p5-notes-api/                 # Spring Boot 3, Java 21, Gradle\ninfra/modules/{network,alb-asg-app,rds-postgres,artifact-bucket}\ninfra/live/dev/p5-three-tier/\n├── network/       # VPC, subnets, routes, NAT, S3 gateway endpoint\n├── artifacts/     # S3 bucket for the jar\n├── database/      # depends on network\n└── app/           # depends on network, database, artifacts\n```\n\n---\n\n## M1 · Design before any HCL\n\n```bash\ncp -R ~/.claude/plugins/cache/ecc/ecc/2.2.3/rules/java .claude/rules/ecc/\n```\n\n```\n> Use the ecc:architect agent. Design the network for P5: ALB + EC2 ASG (Spring Boot) + RDS\n> Postgres, 2 AZs, app and DB in private subnets, budget-constrained lab (deployed a few hours\n> at a time). Give a CIDR plan, route tables, security group rules, and compare 4 egress\n> options for the private app subnets: NAT Gateway (1 vs 2 AZs), NAT instance (e.g. fck-nat),\n> interface VPC endpoints only (ssm, ssmmessages, ec2messages, secretsmanager, logs), and\n> public subnets with no public IP exposure via SGs. Include hourly cost for each.\n```\n\nThen record your choice:\n\n```\n> Use ecc:architecture-decision-records to write docs/adr/0003-p5-egress.md with the option\n> I picked and why.\n```\n\nThe egress question is the most important lesson in this module. Private instances have no\nroute to the internet, but they still need to reach SSM, Secrets Manager, CloudWatch, and a\npackage repo. Every way of allowing that costs something.\n\n## M2 · Network (you write it)\n\nWrite `infra/modules/network` yourself. Hints, not code:\n\n- `aws_vpc` with DNS support + hostnames (needed for endpoints and RDS DNS names).\n- `for_each` over a map of AZ → CIDRs per tier, not `count`, so adding an AZ doesn't\n  renumber everything.\n- One public route table → IGW. Private-app route table(s) → NAT. Private-db route table with\n  **no** default route at all.\n- `aws_vpc_endpoint` type `Gateway` for S3, attached to the private route tables. Free.\n- Variable `nat_mode = \"single\" | \"per_az\" | \"none\"` with a `validation` block.\n\nReview:\n\n```\n> Use ecc:code-reviewer on infra/modules/network. Then explain, for a packet from an app\n> instance to the S3 artifact bucket, which route table entry matches and why.\n```\n\nApply only the network unit, then explore in the console: VPC → Resource map. It draws\nyour subnets, route tables, and gateways. Compare it with the diagram above.\n\n## M3 · The app, test-first\n\n```\n/ecc:plan apps/p5-notes-api: Spring Boot 3, Java 21, Gradle. CRUD for notes {id, title, body,\ncreatedAt, updatedAt} at /api/notes, Flyway migrations, Spring Data JPA, Actuator health at\n/actuator/health with DB check. DB credentials from Secrets Manager via spring.config.import\n(spring-cloud-aws). Tests: Testcontainers Postgres. Use ecc:springboot-tdd and ecc:jpa-patterns.\n```\n\nImplement with the `ecc:springboot-tdd` skill. When the Gradle build breaks: `/ecc:build-fix`.\nThen:\n\n```\n> Use ecc:java-reviewer on apps/p5-notes-api, then ecc:database-reviewer on the Flyway\n> migrations and JPA mappings (indexes, N+1, transaction boundaries).\n```\n\n## M4 · Database + app infrastructure\n\n**`rds-postgres` module.** Key settings and why:\n\n```hcl\nresource \"aws_db_instance\" \"this\" {\n  identifier                  = \"${var.project}-${var.env}-${var.name}\"\n  engine                      = \"postgres\"\n  engine_version              = var.engine_version   # pick a current major, e.g. \"17\"\n  instance_class              = \"db.t4g.micro\"\n  allocated_storage           = 20\n  storage_type                = \"gp3\"\n  db_name                     = \"notes\"\n  username                    = \"notes_admin\"\n  manage_master_user_password = true                 # RDS creates + rotates a Secrets Manager secret\n  db_subnet_group_name        = aws_db_subnet_group.this.name\n  vpc_security_group_ids      = [aws_security_group.db.id]\n  multi_az                    = false                # lab; true doubles the cost\n  publicly_accessible         = false\n  storage_encrypted           = true\n  backup_retention_period     = 1\n  skip_final_snapshot         = true                 # lab only\n  deletion_protection         = false                # lab only\n  apply_immediately           = true\n}\n```\n\n**`alb-asg-app` module.**\n\n- Launch template: AMI from SSM parameter\n  `/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64`,\n  `t4g.small`, `metadata_options { http_tokens = \"required\" }` (IMDSv2),\n  instance profile with `AmazonSSMManagedInstanceCore` + `s3:GetObject` on the jar +\n  `secretsmanager:GetSecretValue` on the RDS secret ARN only.\n- User data: `dnf install -y java-21-amazon-corretto-headless`, `aws s3 cp` the jar,\n  write a systemd unit, start it. Pass the secret ARN as an env var.\n- ALB in public subnets, target group on 8080 with health check `/actuator/health`,\n  `deregistration_delay = 30`.\n- ASG: min 2 / max 4 / desired 2 across both private-app subnets,\n  `health_check_type = \"ELB\"`, target tracking on `ALBRequestCountPerTarget`.\n- Security groups: `alb` allows 80 from `0.0.0.0/0`; `app` allows 8080 **from sg-alb only**;\n  `db` allows 5432 **from sg-app only**. No port 22 anywhere.\n\nSecurity pass before the first apply:\n\n```\n> Use ecc:security-reviewer on infra/modules/{network,rds-postgres,alb-asg-app}: SG rules,\n> IAM instance profile scope, IMDS, public exposure, secrets handling in user data.\n```\n\n## M5 · Lab session: deploy, poke, break, destroy\n\n```bash\nroot=$(git rev-parse --show-toplevel)\n(cd \"$root/apps/p5-notes-api\" && ./gradlew bootJar)\ncd \"$root/infra/live/dev/p5-three-tier\"\nterragrunt run --all apply                     # network → artifacts/database → app\n# upload the jar to the artifact bucket, then refresh instances:\nbucket=$(cd artifacts && terragrunt output -raw bucket_name)\nasg=$(cd app && terragrunt output -raw asg_name)\naws s3 cp \"$root\"/apps/p5-notes-api/build/libs/*-SNAPSHOT.jar \"s3://$bucket/notes-api.jar\"\naws autoscaling start-instance-refresh --auto-scaling-group-name \"$asg\"\n```\n\nExperiments (write down what you expect before each one):\n\n1. `curl http://\u003calb dns>/api/notes`. Create and list notes.\n2. **Session Manager:** EC2 → instance → Connect → Session Manager. From the instance,\n   `curl -s localhost:8080/actuator/health`. Try `curl https://example.com`. Works via NAT;\n   would fail with `nat_mode = \"none\"`.\n3. **Kill an instance.** Terminate one in the console; watch the target go unhealthy and\n   the ASG replace it. How long did it take, and which settings controlled that?\n4. **Scale out.** Load test from your machine (`oha` or `hey`) and watch the target tracking\n   alarm → new instance → registered target.\n5. **Break the SG.** Remove the app → db rule. What does the health check report, and how\n   fast? Restore it.\n6. **Secret rotation.** Rotate the RDS master secret in Secrets Manager. Does the app survive\n   without a restart? (Usually not, and fixing that is a good stretch.)\n\nThen, **same day**:\n\n```bash\nterragrunt run --all destroy                   # reverse dependency order\n```\n\nMake forgetting harder. Hookify `stop` rules can't inspect AWS; they fire on every stop\n(pattern `.*`). So create one that's **disabled by default** and switch it on only for lab\ndays:\n\n```\n/ecc:hookify warn on stop: \"If the P5 lab stack is deployed, destroy it before you leave\n(~$0.15/hour). Run: cd infra/live/dev/p5-three-tier; terragrunt run --all destroy\"\n```\n\nThen `/ecc:hookify-configure` → enable it at the start of a lab session, disable it after\nthe destroy. Your $5 budget alert from Module 1 is the backstop.\n\n## M6 · Verify, learn\n\n```\necc:verification-loop\n/ecc:learn-eval\n```\n\nAdd rules to `aws-terraform`: SG-to-SG references, IMDSv2 required, no port 22, NAT cost\nwarning, `manage_master_user_password`.\n\n---\n\n## Check yourself (no Claude)\n\n1. Your private-db route table has no `0.0.0.0/0` route. How does RDS still get patched and backed up?\n2. Security groups are stateful and NACLs are stateless. Give a concrete rule you'd need in a NACL but not in an SG.\n3. Why does an ALB require subnets in at least two AZs?\n4. An instance passes EC2 status checks but the ASG replaces it anyway. Why? (`health_check_type`)\n5. Multi-AZ RDS vs a read replica: which one helps availability, which one helps read scale, and can one be both?\n6. What does IMDSv2 protect against, and which class of web vulnerability does it mitigate?\n7. Monthly cost of NAT Gateway in 2 AZs with 50 GB processed vs 5 interface endpoints in 2 AZs.\n\n## Stretch goals\n\n- Swap the NAT Gateway for a NAT instance, then for interface endpoints only. Measure the bill difference in Cost Explorer by `Unit` tag.\n- Add HTTPS: ACM cert + 443 listener + HTTP→HTTPS redirect (needs a domain).\n- Turn on Multi-AZ for one session and trigger a failover (`aws rds reboot-db-instance --force-failover`). Time the outage the app sees.\n- Bake an AMI with the app (EC2 Image Builder or Packer) instead of downloading at boot; compare scale-out time.\n- Add an RDS Proxy and explain when it is worth its cost.\n\n## Teardown\n\n**Mandatory after every lab session:**\n\n```bash\ncd infra/live/dev/p5-three-tier && terragrunt run --all destroy\n```\n\nVerify in the console: no NAT Gateways, no load balancers, no RDS instances, no\nunattached Elastic IPs (VPC → Elastic IPs).\n"},{"id":"m07","file":"07-p6-containers.md","title":"Module 7 · P6 · Containers: ECS Fargate, then EKS (later)","md":"# Module 7 · P6 · Containers: ECS Fargate, then EKS (later)\n\nYou already know Docker and Kubernetes, so this module focuses on what AWS adds: the\nregistry, the IAM model for tasks and pods, load balancer integration, and the cost\nshape of each option. Do it after P5. It reuses P5's VPC and Spring Boot app.\n\n**Time:** 2 weekends (ECS) + 1 lab day (EKS) · **Cost:** ECS lab ≈ $0.10/h; EKS lab ≈ $0.25/h. Destroy the same day.\n\n## What you'll learn\n\n| AWS | ECC |\n|---|---|\n| ECR: repositories, image scanning, lifecycle policies, immutable tags | `ecc:docker-patterns`: multi-stage builds, non-root, small images |\n| ECS concepts: cluster, task definition, service, Fargate vs EC2 capacity | `ecc:deployment-patterns`: rolling vs blue/green, health checks |\n| **Task role vs task execution role** (the #1 ECS confusion) | `/ecc:build-fix` for Dockerfile / Gradle issues |\n| `awsvpc` networking: a task gets its own ENI and security group | `ecc:kubernetes-patterns` for the EKS part |\n| ALB target type `ip`, service auto scaling, Fargate Spot | `/ecc:orch-change-feature` to move P5 from EC2 to ECS |\n| ECS deployment circuit breaker and rollback | `/ecc:model-route` to keep long infra sessions cheap |\n| EKS: control plane cost, Auto Mode, Pod Identity, AWS Load Balancer Controller | `/ecc:learn-eval` → `/ecc:evolve` your instincts into a skill |\n\n## Part A · ECS Fargate\n\n### Architecture\n\n```\n developer ──docker build/push──► ECR repo (scan on push, keep last 10 images)\n                                        │\n internet ─► ALB (P5 public subnets) ─► target group (type ip, :8080)\n                                        │\n            ECS service \"notes\" (Fargate, desired 2, private-app subnets, sg-task)\n              task: notes-api container\n                execution role → pull from ECR, write logs, read the DB secret for `secrets`\n                task role      → whatever the app itself calls (nothing, or S3)\n                                        │ sg-task → sg-db:5432\n                                   RDS (P5)\n```\n\n### Steps\n\n1. **Containerize** the P5 app:\n\n   ```\n   > Using ecc:docker-patterns, write apps/p5-notes-api/Dockerfile: multi-stage (Gradle build →\n   > Corretto 21 or distroless Java 21 runtime), non-root user, arm64, layered Spring Boot jar,\n   > HEALTHCHECK not needed (ALB checks), .dockerignore. Explain each choice.\n   ```\n\n   Build and run it locally against a Postgres container before touching AWS.\n\n2. **Plan the move** from EC2 to ECS:\n\n   ```\n   /ecc:orch-change-feature move P5's app tier from the EC2 ASG to ECS Fargate. Reuse the\n   network, database, and ALB. New modules: ecr-repo, ecs-cluster, ecs-service. The DB password\n   is injected via the task definition `secrets` from the RDS-managed secret (execution role\n   reads it). Use Fargate Spot with a Fargate base of 1. Enable the deployment circuit breaker\n   with rollback. Service auto scaling on ALBRequestCountPerTarget.\n   ```\n\n3. **Write the two roles yourself.** The ECS lesson is in these two IAM roles:\n\n   | Role | Assumed by | Used for |\n   |---|---|---|\n   | Task **execution** role | ECS agent (`ecs-tasks.amazonaws.com`) | Pull the image, ship logs, fetch `secrets` before the container starts |\n   | Task role | Your application code | AWS SDK calls the app makes at runtime |\n\n   If the app fails with `AccessDenied` at runtime, it's the task role. If the task never\n   starts and the error mentions `ResourceInitializationError`, it's usually the\n   execution role, or networking: private subnets need a path to ECR, either NAT or\n   endpoints for `ecr.api`, `ecr.dkr`, `logs`, and the S3 gateway endpoint.\n\n4. **Push and deploy:**\n\n   ```bash\n   acct=$(aws sts get-caller-identity --query Account --output text)\n   registry=\"$acct.dkr.ecr.us-east-1.amazonaws.com\"\n   repo=\"$registry/learn-aws-dev-notes\"\n   aws ecr get-login-password | docker login --username AWS --password-stdin \"$registry\"\n   docker buildx build --platform linux/arm64 -t \"$repo:$(git rev-parse --short HEAD)\" --push apps/p5-notes-api\n   ```\n\n   Deploy by changing the image tag input and running `terragrunt apply`. Use immutable\n   tags (git SHA), never `latest`.\n\n5. **Experiments:**\n   - Deploy an image whose health check fails. Watch the circuit breaker roll back.\n   - Stop a task in the console. The service replaces it.\n   - Interrupt behavior: how does the service react when Fargate Spot capacity is reclaimed?\n   - `aws ecs execute-command` into a running task (requires `enableExecuteCommand` + SSM permissions on the task role).\n\n6. **Review:** `> Use ecc:security-reviewer on the ecs-service module and Dockerfile` (root user? secrets in env vs `secrets`? overly broad execution role?).\n\n## Part B · EKS (one lab day, later)\n\nYou know Kubernetes. What's new is the AWS integration, and the cost: the EKS control\nplane is $0.10/hour (~$73/month) before any node runs. That's why EKS here is a single,\nplanned lab day.\n\n### Before the lab\n\n- Do the Kubernetes side locally first (kind or k3d) with the same manifests.\n- Plan with ECC so the lab day is pure execution:\n\n  ```\n  /ecc:plan one-day EKS lab reusing P5's VPC: EKS Auto Mode cluster via Terraform\n  (terraform-aws-modules/eks/aws), Pod Identity for the notes-api service account, the\n  notes-api Deployment + Service + Ingress (ALB via Auto Mode's load balancing), HPA.\n  Include an explicit teardown order (Ingress/ALB first, then cluster) and a cost estimate per hour.\n  ```\n\n- Use `ecc:kubernetes-patterns` for the manifests and review them before the lab.\n\n### Lab day checklist\n\n1. Apply the cluster unit (≈ 15 min). `aws eks update-kubeconfig --name \u003ccluster>`.\n2. Deploy manifests. Find the ALB the Ingress created in the EC2 console. Note it's **not** in Terraform state.\n3. Pod Identity: give the pod S3 read on the artifact bucket and prove it from inside the pod.\n4. Scale: HPA + Auto Mode adds nodes. Watch `kubectl get nodes -w`.\n5. **Teardown in order:** delete the Ingress and Services of type LoadBalancer first (so the\n   controller deletes the ALB/NLB), then `terragrunt destroy` the cluster. Otherwise\n   Terraform can hang on the VPC because orphaned load balancers and ENIs still sit in it.\n\n## Wrap-up: turn the tutorial into reusable knowledge\n\nYou've used ECC for six projects. Now let it consolidate:\n\n```\n/ecc:instinct-status          # what has it learned about how you work?\n/ecc:evolve                   # proposes skills/agents from clustered instincts\n/ecc:skill-create             # derive a learn-aws-patterns skill from your git history\n/ecc:harness-audit            # final score vs Module 0\n```\n\nCompare what `/ecc:skill-create` produced with the `aws-terraform` skill you wrote by hand.\nMerge the good parts. That skill is now the most valuable artifact of this tutorial:\nreusable AWS + Terraform knowledge you can copy to `~/.claude/skills/` for work\nprojects (or promote instincts with `/ecc:promote`).\n\n---\n\n## Check yourself (no Claude)\n\n1. Task role vs execution role: which one needs `secretsmanager:GetSecretValue` for task-definition `secrets`?\n2. Why must the target group use `target_type = \"ip\"` for Fargate?\n3. A Fargate task in a private subnet with no NAT and no endpoints fails to start. Exact reason?\n4. ECS rolling update with `minimumHealthyPercent = 100`, `maximumPercent = 200`: what happens step by step?\n5. ECS vs EKS for a 3-service app on a small team: which do you pick, and what would change your mind?\n6. Why did the EKS-created ALB not appear in Terraform state, and what's the teardown risk?\n\n## Stretch goals\n\n- ECS blue/green deployments with test traffic on a second listener.\n- Add the OpenTelemetry collector as a sidecar and send traces to X-Ray.\n- Build the image in GitHub Actions with the P4 OIDC role and deploy on merge.\n- Run Karpenter instead of Auto Mode on EKS and compare node provisioning.\n\n## Teardown\n\n```bash\ncd infra/live/dev/p5-three-tier && terragrunt run --all destroy\n```\n\nFor EKS: delete Kubernetes load balancers first, then the cluster. Check the console for\nleftover load balancers, ENIs, and EBS volumes.\n"},{"id":"m99","file":"99-cheatsheet.md","title":"Cheat sheet","md":"# Cheat sheet\n\n## ECC: which command when\n\n| I want to… | Use |\n|---|---|\n| Find the right ECC tool | `/ecc:ecc-guide` |\n| Plan a feature (waits for my OK) | `/ecc:plan \"\u003cfeature>\"` |\n| Turn a vague idea into a spec | `/ecc:plan-prd \"\u003cidea>\"` |\n| Build a whole feature with gates | `/ecc:orch-add-feature \"\u003cfeature>\"` |\n| Change existing behavior | `/ecc:orch-change-feature \"\u003cchange>\"` |\n| Fix a bug test-first | `/ecc:orch-fix-defect \"\u003cbug>\"` |\n| Refactor safely (code **or** IaC: prove with empty plan) | `/ecc:orch-refine-code \"\u003carea>\"` |\n| TDD in Go / React / Spring | `/ecc:go-test`, `/ecc:react-test`, `ecc:springboot-tdd` |\n| Fix a broken build | `/ecc:build-fix` |\n| Review my diff | `/ecc:code-review` or `/ecc:go-review` / `/ecc:react-review` |\n| Review a PR with several agents | `/ecc:review-pr` |\n| Security review of code/IaC | `ecc:security-reviewer` agent |\n| Security audit of Claude config | `/ecc:security-scan` |\n| Two reviewers must agree | `/ecc:santa-loop` |\n| Find swallowed errors | `ecc:silent-failure-hunter` agent |\n| Pre-commit gate | `ecc:verification-loop` |\n| Side question mid-task | `/ecc:aside \"\u003cquestion>\"` |\n| Stop for the day / continue | `/ecc:save-session` / `/ecc:resume-session` |\n| Save what I learned | `/ecc:learn-eval` |\n| See / evolve learned instincts | `/ecc:instinct-status`, `/ecc:evolve`, `/ecc:promote` |\n| Make a skill from git history | `/ecc:skill-create` |\n| Enforce a rule with a hook | `/ecc:hookify \"\u003cbehavior>\"`, `/ecc:hookify-list`, `/ecc:hookify-configure` |\n| Record a design decision | `ecc:architecture-decision-records` |\n| Check context / spend | `ecc:context-budget`, `/ecc:cost-report` |\n| Score the repo's agent setup | `/ecc:harness-audit` |\n| Reconfigure ECC | `/ecc:configure-ecc` |\n\n### ECC env vars (Windows user scope via `setx`; open a new terminal and restart Claude after)\n\n```bash\nsetx ECC_HOOK_PROFILE standard                  # standard|strict|permissive\nsetx ECC_DISABLED_HOOKS stop:desktop-notify\nsetx GATEGUARD_EXEMPT_GLOBS 'docs/**'\nsetx ECC_SESSION_RETENTION_DAYS 14\nsetx ECC_MAX_INJECTED_INSTINCTS 6\nsetx ECC_INSTINCT_CONFIDENCE_THRESHOLD 0.7\nsetx AWS_PROFILE learn-admin\n```\n\n## Terragrunt\n\n```bash\nterragrunt backend bootstrap        # create state bucket (once)\nterragrunt plan | apply | destroy   # one unit (cwd)\nterragrunt run --all plan           # every unit below cwd, dependency order\nterragrunt run --all destroy        # reverse dependency order\nterragrunt output -raw \u003cname>\nterragrunt hclfmt                   # format .hcl\nterragrunt --help                   # command names changed in the CLI redesign; check here first\n```\n\nClear caches when things get weird: delete `.terragrunt-cache` folders.\n\n## AWS CLI\n\n```bash\naws sso login --profile learn-admin\naws sts get-caller-identity\nMSYS_NO_PATHCONV=1 aws logs tail /aws/lambda/\u003cfn> --follow   # leading \"/\" needs MSYS_NO_PATHCONV in Git Bash\naws dynamodb scan --table-name \u003ct> --max-items 5 | jq '.Items'\naws sqs get-queue-attributes --queue-url \u003curl> --attribute-names All | jq '.Attributes'\naws ce get-cost-and-usage --time-period Start=2026-10-01,End=2026-10-31 \\\n  --granularity MONTHLY --metrics UnblendedCost --group-by Type=TAG,Key=Project | jq\n```\n\nTip: put `export MSYS_NO_PATHCONV=1` in `~/.zshrc` if you rarely pass Windows paths to tools.\n\n## Cost traps (check before every apply)\n\n| Trap | Cost | Avoid by |\n|---|---|---|\n| NAT Gateway | ~$33/month per AZ + $0.045/GB | Lab mode, single AZ, destroy same day; or endpoints / NAT instance |\n| Interface VPC endpoints | ~$7/month per endpoint per AZ | Only in labs; S3/DynamoDB **gateway** endpoints are free |\n| ALB / NLB | ~$16/month + LCUs | Destroy after lab |\n| Public IPv4 addresses | $0.005/h each (~$3.60/month), incl. idle Elastic IPs | Release EIPs; check VPC → Elastic IPs |\n| RDS left running | ~$12+/month for the smallest | Destroy after lab; don't rely on \"stop\" (auto-restarts after 7 days) |\n| EKS control plane | $0.10/h (~$73/month) | One-day labs only |\n| CloudWatch Logs without retention | Storage grows forever | `retention_in_days = 7` in every module |\n| KMS customer-managed keys | $1/month each | Use AWS-managed keys unless you need a CMK |\n| Secrets Manager | $0.40/secret/month | Fine, but delete lab secrets (they have a recovery window) |\n| Route 53 hosted zone | $0.50/month | Only if you buy a domain |\n| Orphaned EBS volumes / snapshots | $0.08/GB-month (gp3) | Check EC2 → Volumes/Snapshots after labs |\n\n## Teardown checklist (after a lab)\n\n1. `terragrunt run --all destroy` in the lab project folder.\n2. Console sweep in us-east-1: EC2 (instances, volumes, EIPs, load balancers), VPC (NAT gateways, endpoints), RDS, EKS, ECS.\n3. Cost Explorer next day, grouped by `Unit` tag. Anything non-zero you don't recognize?\n4. Disable the lab hookify reminder (`/ecc:hookify-configure`).\n\n## Progress tracker\n\n| Module | Done | Notes / what the reviewers caught |\n|---|---|---|\n| 0 ECC primer | ☐ | |\n| 1 Foundations | ☐ | |\n| 2 P1 Serverless API | ☐ | |\n| 3 P2 Static frontend | ☐ | |\n| 4 P3 Event pipeline | ☐ | |\n| 5 P4 Auth + CI/CD | ☐ | |\n| 6 P5 Three-tier VPC | ☐ | |\n| 7 P6 Containers | ☐ | |\n"}]</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/powershell.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/dockerfile.min.js"></script>
<script>
(function () {
  const DOCS = JSON.parse(document.getElementById('docs-data').textContent);
  const DONE_KEY = 'learn-aws-ecc:done';
  const LAST_KEY = 'learn-aws-ecc:last';

  const store = {
    get(key, fallback) { try { const v = localStorage.getItem(key); return v == null ? fallback : JSON.parse(v); } catch (e) { return fallback; } },
    set(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* storage unavailable: keep in memory only */ } }
  };
  let done = new Set(store.get(DONE_KEY, []));

  if (window.hljs) {
    hljs.registerLanguage('hcl', function (h) {
      return {
        name: 'HCL',
        aliases: ['terraform', 'tf'],
        keywords: {
          keyword: 'resource data variable output locals module provider terraform include dependency inputs remote_state generate dynamic content for_each count for in if condition statement principals',
          literal: 'true false null'
        },
        contains: [
          h.HASH_COMMENT_MODE,
          h.C_LINE_COMMENT_MODE,
          h.C_BLOCK_COMMENT_MODE,
          { className: 'string', begin: '"', end: '"', contains: [h.BACKSLASH_ESCAPE, { className: 'subst', begin: /\$\{/, end: /\}/ }] },
          h.NUMBER_MODE,
          { className: 'attr', begin: /\b[A-Za-z_][\w-]*(?=\s*=[^=])/ }
        ]
      };
    });
  }

  function shortLabel(doc) {
    if (doc.id === 'start') return 'Start here';
    return doc.title.replace(/^Module\s+\d+\s*·\s*/, '').replace(/^P\d\s*·\s*/, '');
  }
  function numLabel(doc) {
    if (doc.id === 'start') return '··';
    if (doc.id === 'm99') return 'ref';
    return doc.id.slice(1);
  }
  function eyebrow(doc) {
    if (doc.id === 'start') return 'Overview';
    if (doc.id === 'm99') return 'Reference';
    const m = doc.title.match(/^Module\s+(\d+)\s*·\s*(P\d)?/);
    return m ? ('Module ' + m[1] + (m[2] ? ' · Project ' + m[2].slice(1) : '')) : '';
  }
  const trackable = DOCS.filter(d => d.id !== 'start' && d.id !== 'm99');

  function renderRail(activeId) {
    const list = document.getElementById('modules');
    list.innerHTML = '';
    DOCS.forEach(doc => {
      const li = document.createElement('li');
      li.className = 'module-item' + (doc.id === activeId ? ' active' : '') + (done.has(doc.id) ? ' is-done' : '');
      const a = document.createElement('a');
      a.href = '#' + doc.id;
      if (doc.id === activeId) a.setAttribute('aria-current', 'page');
      a.innerHTML = '<span class="module-num"></span><span class="module-label"></span>';
      a.firstChild.textContent = numLabel(doc);
      a.lastChild.textContent = shortLabel(doc);
      li.appendChild(a);
      if (trackable.includes(doc)) {
        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.className = 'done-toggle';
        cb.id = 'done-' + doc.id;
        cb.checked = done.has(doc.id);
        cb.setAttribute('aria-label', 'Mark "' + shortLabel(doc) + '" as done');
        cb.addEventListener('change', () => {
          if (cb.checked) done.add(doc.id); else done.delete(doc.id);
          store.set(DONE_KEY, Array.from(done));
          li.classList.toggle('is-done', cb.checked);
          renderProgress();
        });
        li.appendChild(cb);
      }
      list.appendChild(li);
    });
    renderProgress();
  }

  function renderProgress() {
    const n = trackable.filter(d => done.has(d.id)).length;
    document.getElementById('progress-fill').style.width = (trackable.length ? (100 * n / trackable.length) : 0) + '%';
    document.getElementById('progress-text').textContent = n + ' of ' + trackable.length + ' modules done';
  }

  function slug(text, used) {
    let s = text.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'section';
    let out = s, i = 2;
    while (used.has(out)) out = s + '-' + (i++);
    used.add(out);
    return out;
  }

  function enhance(root) {
    // internal .md links -> in-page module routes; external links open in a new tab
    root.querySelectorAll('a[href]').forEach(a => {
      const href = a.getAttribute('href');
      const m = href.match(/^(\d\d)-[\w-]+\.md(?:#.*)?$/);
      if (m) { a.setAttribute('href', '#m' + m[1]); return; }
      if (/^README\.md/.test(href)) { a.setAttribute('href', '#start'); return; }
      if (/^https?:/.test(href)) { a.target = '_blank'; a.rel = 'noopener'; }
    });
    // tables scroll inside their own box
    root.querySelectorAll('table').forEach(t => {
      const wrap = document.createElement('div');
      wrap.className = 'table-wrap';
      t.parentNode.insertBefore(wrap, t);
      wrap.appendChild(t);
    });
    // code blocks: highlight, language tag, copy button
    root.querySelectorAll('pre > code').forEach(code => {
      const pre = code.parentNode;
      const wrap = document.createElement('div');
      wrap.className = 'code-block';
      pre.parentNode.insertBefore(wrap, pre);
      wrap.appendChild(pre);
      const langMatch = (code.className || '').match(/language-([\w-]+)/);
      const lang = langMatch ? langMatch[1] : '';
      if (lang && window.hljs && hljs.getLanguage(lang)) {
        try { hljs.highlightElement(code); } catch (e) { /* leave unhighlighted */ }
      }
      if (lang) {
        const tag = document.createElement('span');
        tag.className = 'code-lang';
        tag.textContent = lang;
        wrap.appendChild(tag);
      }
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'copy-btn';
      btn.textContent = 'Copy';
      btn.addEventListener('click', () => {
        const text = code.innerText;
        const ok = () => { btn.textContent = 'Copied'; setTimeout(() => { btn.textContent = 'Copy'; }, 1400); };
        const fallback = () => {
          const range = document.createRange();
          range.selectNodeContents(code);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          btn.textContent = 'Selected';
          setTimeout(() => { btn.textContent = 'Copy'; }, 1400);
        };
        try {
          navigator.clipboard.writeText(text).then(ok, fallback);
        } catch (e) { fallback(); }
      });
      wrap.appendChild(btn);
    });
    // headings: ids for the TOC; flag cost sections
    const used = new Set();
    const heads = Array.from(root.querySelectorAll('h2'));
    heads.forEach(h => {
      h.id = slug(h.textContent, used);
      if (/^cost\b/i.test(h.textContent.trim())) h.classList.add('is-cost');
    });
    return heads;
  }

  function renderToc(heads) {
    const toc = document.getElementById('toc');
    toc.innerHTML = '';
    if (heads.length < 2) return;
    const label = document.createElement('div');
    label.className = 'rail-label';
    label.style.paddingInline = '0';
    label.textContent = 'On this page';
    const ol = document.createElement('ol');
    heads.forEach(h => {
      const li = document.createElement('li');
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = h.textContent;
      b.addEventListener('click', () => h.scrollIntoView({ behavior: 'smooth', block: 'start' }));
      li.appendChild(b);
      ol.appendChild(li);
    });
    toc.appendChild(label);
    toc.appendChild(ol);
  }

  function renderPager(index) {
    const pager = document.getElementById('pager');
    pager.innerHTML = '';
    const make = (doc, cls, dir) => {
      const a = document.createElement('a');
      a.href = '#' + doc.id;
      a.className = cls;
      a.innerHTML = '<small></small><span></span>';
      a.firstChild.textContent = dir;
      a.lastChild.textContent = shortLabel(doc);
      return a;
    };
    if (index > 0) pager.appendChild(make(DOCS[index - 1], 'prev', 'Previous'));
    if (index < DOCS.length - 1) pager.appendChild(make(DOCS[index + 1], 'next', 'Next'));
  }

  function show(id, scroll) {
    let index = DOCS.findIndex(d => d.id === id);
    if (index < 0) index = 0;
    const doc = DOCS[index];
    const content = document.getElementById('content');
    if (window.marked) {
      content.innerHTML = marked.parse(doc.md, { gfm: true });
    } else {
      content.textContent = doc.md; // CDN blocked: still readable as plain text
      content.style.whiteSpace = 'pre-wrap';
    }
    document.getElementById('eyebrow').textContent = eyebrow(doc);
    renderToc(enhance(content));
    renderPager(index);
    renderRail(doc.id);
    store.set(LAST_KEY, doc.id);
    if (scroll) window.scrollTo(0, 0);
  }

  function current() {
    const h = (location.hash || '').slice(1);
    if (h && DOCS.some(d => d.id === h)) return h;
    return store.get(LAST_KEY, 'start');
  }

  window.addEventListener('hashchange', () => show(current(), true));
  show(current(), false);
})();
</script>
