<script type="application/json" id="docs-data">[{"id":"start","file":"README.md","title":"Learn AWS with ECC","md":"# Learn AWS with ECC\n\nA hands-on path through AWS, built as a series of small but real apps. Every app is\nprovisioned with **Terraform + Terragrunt** and built with **Claude Code + ECC**\n(Everything Claude Code, `ecc@ecc` plugin v2.2.3) as your engineering harness.\n\nTwo things are being learned at once:\n\n1. **AWS** (primary) — serverless, data, networking, security, delivery, and later containers.\n2. **ECC** (secondary) — planning, TDD, review, verification, hooks, skills, and session memory.\n\nNo certification target. The goal is a mental model you can apply at work.\n\n## How to use this tutorial\n\nWork through the modules in order. Each project module has the same shape:\n\n| Section | What it gives you |\n|---|---|\n| What you'll learn | The AWS concepts the project exists to teach |\n| Architecture | ASCII diagram of the resources |\n| Cost | What it costs and how to keep it near $0 |\n| Build steps | Milestones, each with the ECC command or prompt to drive it |\n| Check yourself | Questions to answer *without* Claude before moving on |\n| Stretch goals | Optional extensions |\n| Teardown | How to destroy everything |\n\n**Learning rule:** let ECC plan, test, and review, but write at least one Terraform module\nand one handler per project yourself. Ask Claude to review your version instead of\ngenerating it. You learn AWS by making the mistakes, not by reading generated code.\n\n## Modules\n\n| # | Module | AWS focus | Language | ECC focus |\n|---|---|---|---|---|\n| 0 | [ECC primer](00-ecc-primer.md) | — | — | Concepts, commands, hooks, rules, skills, sessions |\n| 1 | [Foundations](01-foundations.md) | IAM Identity Center, Budgets, S3 state, tagging | HCL | Project CLAUDE.md, rule packs, a custom `aws-terraform` skill, hookify |\n| 2 | [P1 · Serverless URL shortener](02-p1-serverless-api.md) | Lambda, API Gateway HTTP API, DynamoDB, CloudWatch | Go | `/ecc:plan`, `/ecc:go-test`, `/ecc:go-review`, security-reviewer |\n| 3 | [P2 · Static frontend on the edge](03-p2-static-frontend.md) | S3, CloudFront + OAC, CORS, caching | Next.js / TS | `/ecc:react-test`, `/ecc:react-review`, frontend-design |\n| 4 | [P3 · Event-driven import pipeline](04-p3-event-pipeline.md) | S3 events, EventBridge, SQS + DLQ, SNS, Step Functions | TypeScript | `/ecc:orch-add-feature`, silent-failure-hunter, `/ecc:orch-fix-defect` |\n| 5 | [P4 · Auth and CI/CD](05-p4-auth-and-cicd.md) | Cognito, JWT authorizers, GitHub OIDC, IAM trust policies | Go + TS | `/ecc:orch-change-feature`, `/ecc:pr`, `/ecc:code-review` |\n| 6 | [P5 · Classic three-tier in a VPC](06-p5-vpc-three-tier.md) | VPC, subnets, SGs, ALB, ASG, RDS, Secrets Manager, SSM | Java / Spring Boot | architect agent, ADRs, java-reviewer, database-reviewer |\n| 7 | [P6 · Containers (later)](07-p6-containers.md) | ECR, ECS Fargate, autoscaling, then EKS | Java or Go | docker-patterns, kubernetes-patterns, `/ecc:build-fix` |\n| — | [Cheat sheet](99-cheatsheet.md) | Cost traps, teardown, commands | — | Command matrix |\n\n## Your machine (checked 2026-10-08, after Module 1)\n\n| Tool | Version | Note |\n|---|---|---|\n| Claude Code + ECC | `ecc@ecc` 2.2.3, user scope, hook profile `standard` | Rule packs `common` + `golang` copied into `.claude/rules/ecc/` (plugins can't ship rules) |\n| AWS CLI | 2.34.49 | SSO profile `learn-admin` (IAM Identity Center, `LearnAdmin` permission set), region `us-east-1` |\n| Terraform | 1.16.5 | ≥ 1.10 needed for S3 native locking |\n| Terragrunt | 1.1.1 | New CLI: `run --all`, `backend bootstrap`, `root.hcl` |\n| Go | 1.26.2 | P1, P6 |\n| Node | 24.13.0 | P2, P3 |\n| Java | Temurin 21 | P5, P6 |\n| Docker | 29.6.2 | P6 |\n\n## Shell\n\nAll commands are **bash**, written for Git Bash or MSYS2 zsh on Windows (and they work as-is on\nLinux/macOS/WSL). Two Windows-specific habits:\n\n- **Persistent env vars:** `setx NAME value` writes a Windows user variable that every shell,\n  Claude Code tool, and IDE sees. It only affects *new* terminals. `export NAME=value` is for the\n  current shell only.\n- **MSYS path conversion:** Git Bash rewrites arguments that start with `/` into Windows paths,\n  so `aws logs tail /aws/lambda/fn` becomes `C:/Program Files/Git/aws/lambda/fn`. Prefix such\n  commands with `MSYS_NO_PATHCONV=1` (the snippets in this tutorial already do).\n\n## Target repo layout\n\nYou build this up gradually. After Module 1 you have `CLAUDE.md`, `.claude/`, `infra/root.hcl`,\nand the `global/budget` unit; `apps/` and the `dev/` project units arrive with each project.\n\n```\nlearn-aws/\n├── CLAUDE.md                     # project instructions for Claude (Module 1)\n├── .claude/\n│   ├── rules/ecc/                # ECC rule packs copied in (Module 1)\n│   └── skills/aws-terraform/     # your custom skill (Module 1)\n├── apps/                         # application code, one folder per project\n│   ├── p1-shortener/             # Go\n│   ├── p2-web/                   # Next.js\n│   ├── p3-importer/              # TypeScript\n│   └── p5-notes-api/             # Spring Boot\n├── infra/\n│   ├── root.hcl                  # shared Terragrunt config (state, provider, tags)\n│   ├── modules/                  # your own reusable Terraform modules\n│   └── live/\n│       ├── global/               # budget, GitHub OIDC\n│       └── dev/\n│           ├── env.hcl\n│           ├── p1-shortener/\n│           ├── p2-web/\n│           └── ...\n└── docs/                         # this tutorial\n```\n"},{"id":"m00","file":"00-ecc-primer.md","title":"Module 0 · ECC primer","md":"# Module 0 · ECC primer\n\nECC (\"Everything Claude Code\", [github.com/affaan-m/ECC](https://github.com/affaan-m/ECC),\nsite [ecc.tools](https://ecc.tools)) is an open-source harness layer that sits on top of\nClaude Code. It does not replace Claude; it gives Claude a repeatable engineering process\nand a library of specialist knowledge.\n\nIts core loop, in its own words:\n\n```\nplan -> test -> implement -> review -> verify -> remember -> improve\n```\n\nEvery project in this tutorial runs that loop. This module teaches the parts so the\nproject modules can just say \"run `/ecc:go-review`\" without explaining it each time.\n\n---\n\n## 1. The six building blocks\n\n| Block | What it is | Where it runs | How you use it |\n|---|---|---|---|\n| **Commands** | Slash entry points (94 in 2.2.3) | Your main session | Type `/ecc:plan \"...\"` |\n| **Skills** | Reusable workflow + knowledge packs (~290) | Your main session, loaded on demand | Invoke by name (`/ecc:tdd-workflow`) or Claude loads one when its description matches the task |\n| **Agents** | Subagents with a narrow role and restricted tools (~68) | A separate context window | \"Use the `ecc:security-reviewer` agent on `infra/modules/lambda-api`\" |\n| **Hooks** | Scripts that fire on Claude Code events (PreToolUse, PostToolUse, Stop, SessionStart…) | Outside the model, deterministic | Automatic; you tune them with env vars |\n| **Rules** | Always-loaded standards (coding style, testing, security, git) | Every prompt | Copied into `.claude/rules/` (not shipped by the plugin) |\n| **Instincts / memory** | Patterns learned from your sessions, scored 0–1 | Injected at SessionStart | `/ecc:learn`, `/ecc:instinct-status`, `/ecc:evolve` |\n\nThe key distinction to internalize:\n\n- **Skills and rules change what Claude knows.** They cost context tokens.\n- **Agents change where work happens.** A review in a subagent gets a fresh context, so it is not biased by the code it just wrote.\n- **Hooks change what is allowed to happen.** They are code, not prompts, so the model can't talk its way past them.\n\n### Commands vs skills\n\nECC is migrating from commands to skills. Many commands are thin wrappers (\"shims\")\nthat just invoke a skill: `/ecc:orch-add-feature` launches the `orch-add-feature` skill.\nOld short names like `/tdd`, `/eval`, `/verify` were retired; use the namespaced\n`/ecc:...` forms or the skill names. Because ECC is installed as a plugin, everything is\nnamespaced with `ecc:`.\n\n---\n\n## 2. What is installed on your machine\n\n| Item | State |\n|---|---|\n| Install method | Claude Code plugin `ecc@ecc` 2.2.3, user scope (`~/.claude/plugins/cache/ecc/ecc/2.2.3`) |\n| Hooks | Enabled, profile `standard` (set in `~/.claude/settings.json` → `pluginConfigs.ecc@ecc.options`) |\n| Rules | **None installed.** Claude Code plugins can't distribute rules. You add them in Module 1 |\n| MCP servers | Only `chrome-devtools` from ECC. `context7` is **not** enabled, so the `ecc:docs-lookup` agent won't work until you add it |\n| Other plugins | `frontend-design`, `gopls-lsp` enabled; `superpowers` disabled (good, it overlaps with ECC) |\n\n**One install path only.** The README is explicit: don't also run `./install.sh` or\n`pnpm dlx ecc-universal install --profile full` on top of the plugin. Duplicate hooks fire\ntwice and skills collide. To change scope or hook profile, use `/ecc:configure-ecc`.\n\nUseful health commands (run in a normal terminal, not inside Claude):\n\n```bash\npnpm dlx ecc-universal@2.2.3 list-installed\npnpm dlx ecc-universal@2.2.3 doctor\npnpm dlx ecc-universal@2.2.3 repair\n```\n\n---\n\n## 3. Hooks you will actually meet\n\nThese are the hook IDs registered by your install. You will see some of them within\nminutes of starting a session.\n\n| Hook ID | When | What it does |\n|---|---|---|\n| `pre:edit-write:gateguard-fact-force` | First Edit/Write to each file | **GateGuard.** Blocks the first write and makes Claude state facts: who calls the file, that no duplicate exists, data shapes, your verbatim instruction. Then allows the retry |\n| `pre:powershell:gateguard-fact-force` | First PowerShell command | Same idea for the shell: state the request and what the command does |\n| `pre:config-protection` | Edits to config files | Guards linter/formatter/harness config from being \"fixed\" by weakening it |\n| `pre:edit-write:suggest-compact` | During long edit runs | Suggests `/compact` at a logical boundary (see `ecc:strategic-compact`) |\n| `pre:write:doc-file-warning` | Writing ad-hoc `.md` files | Warns about doc sprawl |\n| `pre:mcp-health-check` / `post:mcp-health-check` | MCP calls | Detects dead MCP servers |\n| `pre:observe`, `post:skill:track` | Tool and skill use | Feeds continuous learning and `/ecc:skill-health` |\n| `stop:format-typecheck` | End of a turn | Runs formatter/type checks on edited files |\n| `stop:check-console-log` | End of a turn | Flags leftover `console.log` |\n| `stop:cost-tracker` | End of a turn | Records token cost → `/ecc:cost-report` |\n| `stop:evaluate-session` | End of a turn | Scores the session for learnable patterns |\n| `stop:desktop-notify` | End of a turn | Desktop notification when Claude finishes |\n| `session-start-bootstrap` | Session start | Injects saved context and relevant instincts |\n\n**GateGuard is the one that surprises people.** It feels like friction, but it is the\npoint: ECC's A/B tests show that forcing the model to *gather* facts (run Grep, read\ncallers) produces better edits than asking it \"are you sure?\". When you watch Claude\nwork in this repo you'll see it answer GateGuard before its first write to each file.\n(This tutorial itself was written through GateGuard: every new file was denied once\nuntil the facts were stated.)\n\n### Tuning hooks (Windows)\n\n`setx` stores a Windows user environment variable, so Claude Code sees it no matter which\nshell launched it:\n\n```bash\n# Strictness: standard (default) | strict | permissive\nsetx ECC_HOOK_PROFILE standard\n\n# Turn off specific hooks by ID (comma-separated)\nsetx ECC_DISABLED_HOOKS stop:desktop-notify\n\n# Exempt paths from GateGuard's first-touch check (e.g. docs)\nsetx GATEGUARD_EXEMPT_GLOBS 'docs/**'\n\n# Keep session temp files 14 days instead of 30\nsetx ECC_SESSION_RETENTION_DAYS 14\n```\n\nOpen a new terminal and restart Claude Code after changing them. Don't exempt `infra/` from GateGuard;\nthat's where you want it most.\n\n---\n\n## 4. The commands that matter for this tutorial\n\nYou don't need 94 commands. These ~25 cover everything here.\n\n### Plan\n\n| Command | Use it when |\n|---|---|\n| `/ecc:plan \"\u003cfeature>\"` | Default. Restates requirements, lists risks, writes a step plan, **waits for your confirm** before touching code |\n| `/ecc:plan-prd \"\u003cidea>\"` | The idea is fuzzy. Produces a short problem-first PRD, then hands off to `/ecc:plan` |\n| `/ecc:plan-canvas` | You want to annotate/approve a plan visually in the browser |\n| `/ecc:feature-dev` | Guided feature work in an existing codebase |\n\nSkip `/ecc:multi-plan` and the other `multi-*` commands; they need an external\nruntime (`ccg-workflow`) that isn't part of the base install.\n\n### Build with tests\n\n| Command / skill | Use it when |\n|---|---|\n| `/ecc:go-test` | Go TDD: table-driven tests first, 80%+ coverage |\n| `/ecc:react-test` | React TDD with Testing Library + Vitest/Jest |\n| `ecc:tdd-workflow` (skill) | Language-agnostic red → green → refactor |\n| `ecc:springboot-tdd` (skill) | Spring Boot TDD (JUnit 5, MockMvc, Testcontainers) |\n| `/ecc:test-coverage` | Find gaps and generate missing tests |\n| `/ecc:build-fix` | Build or type errors. Delegates to the right `*-build-resolver` agent with minimal diffs |\n\n### Orchestrated pipelines (gated)\n\nThese run a whole Research → Plan → TDD → Review → Commit pipeline with **two approval\ngates**: approve the plan (Gate 1), approve the commit (Gate 2).\n\n| Command | Use it when |\n|---|---|\n| `/ecc:orch-add-feature \"\u003cwhat>\"` | Brand-new capability |\n| `/ecc:orch-change-feature \"\u003cwhat>\"` | Changing behavior of something that works |\n| `/ecc:orch-fix-defect \"\u003cbug>\"` | Bug: reproduce as failing test → fix → review |\n| `/ecc:orch-refine-code \"\u003carea>\"` | Behavior-preserving refactor |\n| `/ecc:orch-build-mvp \u003cspec>` | Bootstrap an MVP from a spec doc |\n\n### Review\n\n| Command / agent | Use it when |\n|---|---|\n| `/ecc:code-review` | Step-by-step checklist review of uncommitted changes or a PR |\n| `/ecc:go-review`, `/ecc:react-review`, … | Language-specific reviewer agents |\n| `/ecc:review-pr` | Multi-agent PR review (code, comments, tests, silent failures, types) |\n| `/ecc:orch-review` | Adversarially verified review, blocking vs advisory findings |\n| `ecc:security-reviewer` (agent) | Anything touching IAM, auth, input handling, secrets |\n| `ecc:silent-failure-hunter` (agent) | Swallowed errors, bad fallbacks. Gold for async pipelines |\n| `/ecc:santa-loop` | Two independent reviewers must both approve. Use on IAM policies |\n\nNote: Claude Code also has a built-in `/code-review` (no `ecc:` prefix) with effort\nlevels. Both are fine; the ECC one follows ECC's checklist and rules.\n\n### Verify\n\n| Command / skill | Use it when |\n|---|---|\n| `ecc:verification-loop` (skill) | Before a commit/PR: build, types, lint, tests+coverage, security grep, diff review → PASS/FAIL report |\n| `/ecc:quality-gate \u003cfile>` | Formatter/quality gate on one file |\n| `/ecc:checkpoint` | Create/verify named checkpoints during a long task |\n\n### Remember and improve\n\n| Command | Use it when |\n|---|---|\n| `/ecc:save-session` | Stopping mid-task. Writes state to `~/.claude/session-data/` |\n| `/ecc:resume-session` | Starting the next day |\n| `/ecc:aside \"\u003cquestion>\"` | Side question (\"SQS visibility timeout vs Lambda timeout?\") without derailing the task |\n| `/ecc:learn-eval` | End of a project. Extracts reusable patterns, self-evaluates them, asks where to save |\n| `/ecc:instinct-status` | See what ECC has learned about you, with confidence scores |\n| `/ecc:evolve` | Cluster instincts into proposed skills/agents |\n| `/ecc:skill-create` | Generate a `SKILL.md` from this repo's git history |\n| `/ecc:hookify \"\u003cbehavior>\"` | Turn a rule into an enforced hook (\"warn me before any terragrunt apply\") |\n\n### Context and cost\n\n| Command / skill | Use it when |\n|---|---|\n| `ecc:context-budget` (skill) | Find out what's eating your context window |\n| `ecc:strategic-compact` (skill) | Learn when to `/compact` (between phases, not mid-task) |\n| `/ecc:cost-report` | Spend summary from the cost-tracker hook |\n| `/ecc:model-route` | Pick a model tier for a task |\n\n### Navigation\n\n| Command | Use it when |\n|---|---|\n| `/ecc:ecc-guide` | \"Is there an ECC skill/agent/command for X?\" Answers from the installed repo |\n| `/ecc:harness-audit` | Scorecard of how well this repo is set up for agent work |\n| `/ecc:security-scan` | AgentShield audit of **agent config**: hooks, MCP, permissions, secrets in `.claude/`. It does not review app code; use `ecc:security-reviewer` for that |\n\n---\n\n## 5. How a typical ECC session flows\n\n```\n/ecc:resume-session                     # (optional) pick up yesterday's state\n/ecc:plan \"add a GET /{code} redirect\"  # read the plan critically; edit; confirm\n  -> implement with /ecc:go-test        # failing test first, then code\n  -> /ecc:go-review                     # fresh-context review in a subagent\n  -> ecc:verification-loop              # PASS/FAIL report\n  -> terragrunt plan  (you read it)     # infra diff, human-reviewed\n  -> terragrunt apply (you run it)\n/ecc:learn-eval                         # keep what was worth learning\n/ecc:save-session                       # if you're stopping mid-way\n```\n\nFor bigger features, replace the middle with one `/ecc:orch-add-feature` call and\nhonor its two gates.\n\n---\n\n## 6. Using ECC to *learn*, not just to ship\n\nECC is tuned to produce working code fast. When learning, slow it down on purpose.\n\n| Instead of | Try |\n|---|---|\n| \"Write the DynamoDB module\" | \"Don't write code. List what a DynamoDB table module needs as inputs/outputs and why. I'll write it, then you review it with `ecc:security-reviewer`.\" |\n| Accepting the plan | Ask \"what are two alternative AWS designs and why did you reject them?\" Record the answer as an ADR (`ecc:architecture-decision-records`) |\n| Asking Claude to fix an error | Read the error first, write your hypothesis, then `/ecc:aside \"is my hypothesis right: ...\"` |\n| Moving to the next project | Answer the \"Check yourself\" questions without Claude, then ask Claude to grade your answers |\n| Re-reading docs | \"Quiz me with 5 questions on IAM trust vs permission policies, one at a time\" |\n\n---\n\n## 7. Your first 20 minutes with ECC\n\nDo these now, inside `learn-aws`:\n\n1. `claude` → `/ecc:ecc-guide` → ask: \"Which ECC skills and agents are relevant for AWS + Terraform work?\" The answer will be mostly generic (backend, deployment, docker, security). ECC has **no Terraform/AWS-specific skill**. You'll write one in Module 1.\n2. `/ecc:aside \"explain the difference between an ECC skill, agent, hook, and rule in two lines each\"`. Compare with the table above.\n3. `/ecc:harness-audit` → read the scorecard for this (still empty) repo. Run it again after Module 1 to see the score move.\n4. `/ecc:plan \"create a hello-world Go CLI in apps/hello\"` → read the plan, then **reject** it and ask for a smaller one. Get used to the plan/confirm gate.\n5. Check `/ecc:cost-report` at the end of the day.\n\n## 8. Pitfalls\n\n- **Context weight.** ~290 skills means a big skill catalogue. Use `ecc:context-budget` if sessions feel sluggish, and keep enabled MCP servers under ~10.\n- **Windows native caveats.** As of 2.2.3, ECC has open issues for the continuous-learning daemon and memory-vault writes on native Windows ([#2489](https://github.com/affaan-m/ECC/issues/2489), [#2626](https://github.com/affaan-m/ECC/issues/2626)). Manual `/ecc:learn` and `/ecc:save-session` work. If instincts never appear, that's why; WSL is the workaround.\n- **Don't let hooks become noise.** If a hook fires constantly and you always dismiss it, disable that hook ID instead of learning to ignore all hooks.\n- **Plans are drafts.** `/ecc:plan` is good at structure but will happily pick expensive AWS defaults (NAT gateways, multi-AZ RDS). Always check cost in the plan.\n- **Agents inherit your AWS credentials.** Anything Claude runs in the shell runs as you. Module 1 sets up guardrails before any `apply`.\n\n## Sources\n\n- ECC repository and README: \u003chttps://github.com/affaan-m/ECC>\n- Shortform guide: \u003chttps://github.com/affaan-m/ECC/blob/main/the-shortform-guide.md>\n- Command quick reference: \u003chttps://github.com/affaan-m/ECC/blob/main/COMMANDS-QUICK-REF.md>\n- Local install: `~/.claude/plugins/cache/ecc/ecc/2.2.3/` (README, `commands/`, `skills/`, `hooks/hooks.json`)\n"},{"id":"m01","file":"01-foundations.md","title":"Module 1 · Foundations","md":"# Module 1 · Foundations\n\nBefore building anything, make the account safe to experiment in and set up the repo\nso that ECC knows how you want AWS + Terraform work done.\n\n**Time:** 2–3 hours · **Cost:** $0\n\n## What you'll learn\n\n| AWS | ECC |\n|---|---|\n| Why long-lived IAM user keys are a liability, and how IAM Identity Center (SSO) replaces them | Project `CLAUDE.md` vs rules vs skills: which knowledge goes where |\n| AWS Budgets and cost allocation tags | Copying ECC rule packs into a project |\n| Remote Terraform state in S3 with native locking (no DynamoDB table needed since Terraform 1.10) | Writing your own skill (ECC has none for Terraform/AWS) |\n| Terragrunt `root.hcl` + units, `default_tags`, the state-bucket chicken-and-egg | `/ecc:hookify` to block Claude from running `apply`/`destroy` |\n| | `/ecc:security-scan` (AgentShield) and `/ecc:harness-audit` |\n\n---\n\n## Step 1 · Lock down the account\n\n### 1a. Root user\n\n- Root has MFA, root has **no access keys**. Check: IAM console → Security recommendations.\n- Never use root for daily work.\n\n### 1b. Replace the IAM user keys with IAM Identity Center\n\nToday your CLI runs as an admin IAM user with long-lived access keys in\n`~/.aws/credentials`. Claude Code (and every ECC agent) runs shell commands with those\nsame keys. Short-lived SSO credentials expire in hours, which limits the blast radius of\nanything that goes wrong.\n\n1. Console → **IAM Identity Center** → Enable. (This creates an AWS Organization with your\n   account as the management account. That's normal for a single learning account.)\n2. Identity source: keep the default Identity Center directory. **Users** → create\n   `diego` with your email, accept the invite, set a password + MFA.\n3. **Permission sets** → create `LearnAdmin` from the predefined `AdministratorAccess`\n   policy, session duration 4 hours. (Admin is acceptable for a sandbox. In P4 you'll build\n   a narrower role for CI.)\n4. **AWS accounts** → select your account → Assign users → `diego` → `LearnAdmin`.\n5. Configure the CLI:\n\n   ```bash\n   aws configure sso --profile learn-admin\n   #   SSO session name: learn\n   #   SSO start URL:    (from Identity Center dashboard, \"AWS access portal URL\")\n   #   SSO region:       us-east-1\n   #   Scopes:           sso:account:access   (default)\n   #   Pick the account + LearnAdmin role, region us-east-1, output json\n\n   aws sso login --profile learn-admin\n   aws sts get-caller-identity --profile learn-admin   # Arn should contain AWSReservedSSO_LearnAdmin\n   ```\n\n6. Make it the default everywhere. Set it as a **Windows user environment variable**, not\n   only in a shell rc file. Then zsh, Claude Code's Bash and PowerShell tools, and IntelliJ/VS\n   Code all see it:\n\n   ```bash\n   setx AWS_PROFILE learn-admin   # works from zsh, bash, cmd or PowerShell\n   ```\n\n   Open a **new** terminal (`setx` doesn't change the current one) and check with\n   `echo $AWS_PROFILE` and `aws sts get-caller-identity`. Restart Claude Code too.\n\n   Avoid `export AWS_PROFILE=...` in `~/.zshrc` alone: Claude Code's Bash tool runs bash and\n   doesn't read `.zshrc`, so Claude would silently use a different identity than your terminal.\n   If your zsh runs inside **WSL**, it has its own `~/.aws` and doesn't inherit Windows env vars,\n   so configure SSO there separately.\n\n7. Once SSO works, **deactivate** (don't delete yet) the old IAM user's access keys in the IAM\n   console. Delete them after a week of not needing them.\n\n> You already have profiles `default` and `learn` in `~/.aws/config`. Check what `learn`\n> points to with `aws configure list --profile learn` and remove it if it's stale.\n\n### 1c. Turn on cost visibility\n\n- Billing → **Cost allocation tags**: after Step 5's first apply, activate the `Project`,\n  `Env`, and `Unit` tags. Tags only show up in Cost Explorer after activation, and only\n  from that day forward.\n- Billing → **Cost Anomaly Detection**: create a default monitor (free).\n- The budget itself is created in Terraform in Step 5.\n\n### Free tier reality check (2026)\n\nAccounts created **after 15 July 2025** don't get the old 12-month free tier (750 h of\nEC2/RDS, 1M API Gateway calls, …). They get $100–$200 in credits on a Free plan that\ncloses after 6 months or when credits run out, unless you upgrade to the Paid plan.\n**Always-free** limits still apply to everyone: Lambda (1M requests + 400k GB-s/month),\nDynamoDB (25 GB + 25 RCU/WCU provisioned), SNS, SQS (1M requests), CloudFront (1 TB out,\n10M requests), CloudWatch basics. Check Billing → Free tier to see which model your\naccount is on.\n\n---\n\n## Step 2 · Upgrade Terragrunt\n\nYour 0.63.6 predates the CLI redesign. This tutorial uses:\n\n- `root.hcl` as the shared config file (a root `terragrunt.hcl` is now deprecated)\n- `terragrunt run --all \u003ccmd>` (replaces `run-all`)\n- `terragrunt backend bootstrap` (explicit state-bucket creation)\n\n```bash\nwhich -a terragrunt terraform   # more than one path each = duplicate installs; the first wins\nwinget upgrade --id Gruntwork.Terragrunt\nwinget upgrade --id Hashicorp.Terraform\nwinget install --id jqlang.jq   # JSON on the command line; used throughout the tutorial\n```\n\n**Gotcha:** the Chocolatey `terragrunt` package stopped at 0.63.6, so `choco upgrade` reports\n\"latest version available\" and does nothing. Keep one source (winget) and remove the Chocolatey\ncopies. `choco uninstall` needs an elevated shell: open Git Bash or PowerShell with\n\"Run as administrator\", then run `choco uninstall terragrunt terraform -y`.\n\nOpen a new terminal and check:\n\n```bash\nwhich -a terragrunt terraform   # one path each, under .../WinGet/...\nterragrunt --version            # 1.x\nterraform version               # >= 1.10\njq --version\n```\n\nIf winget doesn't manage it, download `terragrunt_windows_amd64.exe` from\n\u003chttps://github.com/gruntwork-io/terragrunt/releases>, rename to `terragrunt.exe`, and put it\non your PATH.\n\n---\n\n## Step 3 · Repo + ECC setup\n\n### 3a. git\n\n```bash\ncd ~/dev/aws/learn-aws\ngit init -b main\n```\n\n`.gitignore`:\n\n```gitignore\n# Terraform / Terragrunt\n.terraform/\n.terragrunt-cache/\n*.tfstate\n*.tfstate.*\ncrash.log\n*.tfplan\n.terraform.lock.hcl.bak\n\n# Build output\ndist/\nbuild/\nbin/\n*.zip\nnode_modules/\ntarget/\n.gradle/\n.next/\nout/\n\n# Secrets\n.env\n.env.*\n!.env.example\n```\n\nCommit the generated `.terraform.lock.hcl` files (provider pinning), not the caches.\n\n### 3b. Copy ECC rule packs into the project\n\nThe plugin can't ship rules, so copy them from your installed plugin. Start small: rules\nare loaded on every prompt, so only add a language pack when you reach that project.\n\n```bash\necc=~/.claude/plugins/cache/ecc/ecc/2.2.3/rules\nmkdir -p .claude/rules/ecc\ncp -R \"$ecc/common\" \"$ecc/golang\" .claude/rules/ecc/   # golang is for P1\n# later: typescript (P2/P3), java (P5)\n```\n\nRead `common/security.md` and `common/testing.md` once. They define the bar the\nreviewers will hold you to (e.g. 80% coverage, no hardcoded secrets). Edit them if you\ndisagree; they are your rules now. Re-copy after major ECC upgrades.\n\n### 3c. Project `CLAUDE.md`\n\nCreate `CLAUDE.md` at the repo root. Keep it short; it's loaded every session.\n\n```markdown\n# learn-aws\n\nLearning repo: small AWS apps provisioned with Terraform + Terragrunt.\nTutorial lives in docs/. Current module: see docs/README.md.\n\n## Ground rules\n- I am learning. When I ask \"why\", explain the AWS concept before writing code.\n- Region us-east-1, single env `dev`, AWS profile `learn-admin` (SSO).\n- Cost: free tier + a few dollars. Flag anything that bills hourly (NAT gateway,\n  ALB, RDS, EKS, interface VPC endpoints, public IPv4) before proposing it.\n- Never run `terragrunt apply`, `terragrunt destroy`, `terraform apply/destroy`, or\n  `aws ... delete-*`. Run `terragrunt plan` and show me the summary; I apply.\n\n## Layout\n- apps/\u003cproject>/   application code (Go, TS, Java)\n- infra/modules/    reusable Terraform modules (no provider blocks)\n- infra/live/       Terragrunt units; root config is infra/root.hcl\n- docs/             tutorial\n\n## Conventions\n- Use the aws-terraform skill for anything under infra/.\n- Every project ends with a teardown section that actually works.\n- Node/TypeScript projects use pnpm (never npm/npx).\n- Shell: bash (Git Bash on Windows). Use the Bash tool, not PowerShell. Scripts are `*.sh`.\n  Prefix AWS commands with `/`-leading arguments with `MSYS_NO_PATHCONV=1`.\n```\n\n### 3d. Write your first skill: `aws-terraform`\n\nECC has ~290 skills and none of them cover Terraform or AWS. Confirm that yourself\nfirst. That's what ECC's `skill-scout` skill is for:\n\n```\n/ecc:skill-scout   find an existing skill for Terraform + Terragrunt on AWS\n```\n\nThen create `.claude/skills/aws-terraform/SKILL.md`. The `description` is what makes\nClaude load it, so lead with \"Use when …\" (ECC's own convention).\n\n```markdown\n---\nname: aws-terraform\ndescription: \"Use when creating, editing, or reviewing Terraform modules or Terragrunt units under infra/, choosing AWS resource settings, writing IAM policies, or estimating AWS cost for this repo.\"\n---\n\n# AWS + Terraform conventions for learn-aws\n\n## Layout\n- Modules: infra/modules/\u003cname>/{main.tf,variables.tf,outputs.tf,versions.tf}\n- Units:   infra/live/\u003cenv>/\u003cproject>/\u003cunit>/terragrunt.hcl\n- Root:    infra/root.hcl generates backend.tf and provider.tf. Modules never declare\n  `provider` or `backend` blocks. versions.tf owns `required_version` and `required_providers`\n  (with version constraints); root.hcl must never generate a `terraform {}` block.\n- On Windows, path functions return backslashes. Normalize with\n  `replace(path_relative_to_include(), \"\\\\\", \"/\")` before putting a path in a string or S3 key.\n\n## Unit template\n    include \"root\" { path = find_in_parent_folders(\"root.hcl\") }\n    terraform { source = \"${get_repo_root()}/infra/modules/\u003cmodule>\" }\n    dependency \"x\" {\n      config_path  = \"../x\"\n      mock_outputs = { ... }   # so `plan` works before x exists\n    }\n    inputs = { ... }\n\n## Module rules\n- Every variable has a type and description; validate enums with `validation` blocks.\n- Output names AND ARNs for everything another unit might reference.\n- Names: \"${var.project}-${var.env}-\u003cthing>\". Tags come from provider default_tags.\n- CloudWatch log groups are created explicitly with retention_in_days = 7.\n- S3 buckets: block public access, SSE enabled, `force_destroy = true` (learning repo).\n- DynamoDB: PAY_PER_REQUEST, point-in-time recovery off unless asked.\n\n## IAM\n- No `\"Action\": \"*\"` or `\"Resource\": \"*\"` except where AWS requires `*` (e.g. some\n  `logs:` and `xray:` actions). Scope to ARNs from module inputs.\n- Prefer `aws_iam_policy_document` data sources over JSON strings.\n- One role per workload; trust policy limited to the one service principal.\n\n## Cost guardrails (flag before proposing)\n- Hourly billing: NAT gateway, ALB/NLB, RDS, EKS control plane, interface VPC endpoints,\n  public IPv4 addresses, Secrets Manager secrets, KMS customer keys.\n- Prefer: Lambda, DynamoDB on-demand, SQS, SNS, S3, CloudFront, HTTP APIs.\n\n## Safety\n- Never run apply/destroy. Run `terragrunt plan` and summarize: adds/changes/destroys,\n  anything replaced (-/+), any IAM change.\n```\n\nTest that it triggers: start a new session and ask \"what are the rules for a new\nDynamoDB module here?\" Claude should cite the skill. You'll grow this file every project:\neach time a reviewer catches a mistake, add the rule here so it isn't repeated.\n\n### 3e. Make the \"never apply\" rule enforceable\n\n`CLAUDE.md` asks; hooks and permissions enforce. Use two layers.\n\n**Layer 1: ECC hookify.** Hookify rules are Markdown files with YAML frontmatter\n(`.claude/hookify.\u003cname>.local.md`) that match `bash`, `file`, `prompt`, or `stop` events\nby regex and either `warn` or `block`:\n\n```\n/ecc:hookify block any bash command that runs terragrunt apply, terragrunt destroy,\nterraform apply, terraform destroy, or \"aws ... delete-\" and tell me to run it myself\n```\n\nCheck the result with `/ecc:hookify-list`, and open the generated file to read the regex.\nIt will look roughly like:\n\n```markdown\n---\nname: block-iac-apply-destroy\nenabled: true\nevent: bash\naction: block\npattern: (terragrunt|terraform)\\s+(run\\s+--all\\s+)?(apply|destroy)|aws\\s+\\S+\\s+delete-\n---\nDon't run apply/destroy/delete. Show the plan summary and let me run it.\n```\n\n**Layer 2: Claude Code permissions.** Hookify's `bash` event matches the Bash tool. On\nWindows Claude also has a PowerShell tool, which that rule may not cover. Add\ndeny rules for both tools to the project's `.claude/settings.json`. Ask Claude to do it,\nusing the built-in `update-config` skill:\n\n```\n> Add project permission deny rules so neither the Bash nor the PowerShell tool can run\n> terragrunt apply/destroy, terraform apply/destroy, or aws commands containing \"delete-\".\n```\n\nTest both layers: ask Claude to run `terragrunt apply` in an empty folder, once via Bash\nand once via PowerShell. Both should be refused. Add `.claude/*.local.md` to `.gitignore`\nif you don't want hookify rules in git (or commit them: they're useful documentation).\n\n### 3f. Audit\n\n```\n/ecc:security-scan     # AgentShield: checks .claude/ config, hooks, permissions, secrets\n/ecc:harness-audit     # compare with the score from Module 0\n```\n\nCommit: `git add -A; git commit -m \"chore: repo foundations, ECC rules, aws-terraform skill\"`.\n\n---\n\n## Step 4 · Terragrunt root config\n\n`infra/root.hcl`:\n\n```hcl\nlocals {\n  env_vars   = read_terragrunt_config(find_in_parent_folders(\"env.hcl\"))\n  env        = local.env_vars.locals.env\n  region     = \"us-east-1\"\n  project    = \"learn-aws\"\n  account_id = get_aws_account_id()\n  # Forward slashes on every OS: Windows returns \"live\\global\\budget\", which breaks HCL strings\n  # (\"\\g\" is an invalid escape) and would give different S3 state keys than Linux/macOS/CI.\n  unit_path = replace(path_relative_to_include(), \"\\\\\", \"/\")\n}\n\nremote_state {\n  backend = \"s3\"\n  generate = {\n    path      = \"backend.tf\"\n    if_exists = \"overwrite_terragrunt\"\n  }\n  config = {\n    bucket       = \"${local.project}-tfstate-${local.account_id}\"\n    key          = \"${local.unit_path}/terraform.tfstate\"\n    region       = local.region\n    encrypt      = true\n    use_lockfile = true # S3-native locking (Terraform >= 1.10), no DynamoDB table\n  }\n}\n\ngenerate \"provider\" {\n  path      = \"provider.tf\"\n  if_exists = \"overwrite_terragrunt\"\n  # Only the provider *configuration*. Provider *requirements* (source, version) live in each\n  # module's versions.tf; Terraform allows one required_providers block per module.\n  contents  = \u003c\u003c-EOF\n    provider \"aws\" {\n      region = \"${local.region}\"\n      default_tags {\n        tags = {\n          Project   = \"${local.project}\"\n          Env       = \"${local.env}\"\n          Unit      = \"${local.unit_path}\"\n          ManagedBy = \"terragrunt\"\n        }\n      }\n    }\n  EOF\n}\n\ninputs = {\n  project = local.project\n  env     = local.env\n}\n```\n\n`infra/live/global/env.hcl` and `infra/live/dev/env.hcl`:\n\n```hcl\nlocals {\n  env = \"global\" # \"dev\" in live/dev/env.hcl\n}\n```\n\nWhat to notice:\n\n- `path_relative_to_include()` gives each unit its own state key, e.g.\n  `live/global/budget/terraform.tfstate`.\n- `inputs` in root are merged into every unit, so every module gets `project` and `env`.\n  That means every module must declare those two variables.\n- `get_repo_root()` (used in units) needs the git repo from Step 3a.\n\n---\n\n## Step 5 · First unit: a budget\n\nWrite this module **yourself** using the skill's conventions, then have Claude review it.\nReference solution:\n\n`infra/modules/budget/variables.tf`\n\n```hcl\nvariable \"project\" {\n  type        = string\n  description = \"Project name, used in resource names.\"\n}\n\nvariable \"env\" {\n  type        = string\n  description = \"Environment name.\"\n}\n\nvariable \"limit_usd\" {\n  type        = string\n  description = \"Monthly budget in USD.\"\n  default     = \"5\"\n}\n\nvariable \"actual_thresholds\" {\n  type        = list(number)\n  description = \"Percent of the limit that triggers an ACTUAL-spend email.\"\n  default     = [50, 80, 100]\n}\n\nvariable \"email\" {\n  type        = string\n  description = \"Where budget alerts go.\"\n}\n```\n\n`infra/modules/budget/main.tf`\n\n```hcl\nresource \"aws_budgets_budget\" \"monthly\" {\n  name         = \"${var.project}-${var.env}-monthly\"\n  budget_type  = \"COST\"\n  limit_amount = var.limit_usd\n  limit_unit   = \"USD\"\n  time_unit    = \"MONTHLY\"\n\n  dynamic \"notification\" {\n    for_each = var.actual_thresholds\n    content {\n      comparison_operator        = \"GREATER_THAN\"\n      threshold                  = notification.value\n      threshold_type             = \"PERCENTAGE\"\n      notification_type          = \"ACTUAL\"\n      subscriber_email_addresses = [var.email]\n    }\n  }\n\n  notification {\n    comparison_operator        = \"GREATER_THAN\"\n    threshold                  = 100\n    threshold_type             = \"PERCENTAGE\"\n    notification_type          = \"FORECASTED\"\n    subscriber_email_addresses = [var.email]\n  }\n}\n```\n\n`infra/modules/budget/outputs.tf`\n\n```hcl\noutput \"budget_name\" {\n  value = aws_budgets_budget.monthly.name\n}\n```\n\n`infra/modules/budget/versions.tf`\n\n```hcl\nterraform {\n  required_version = \">= 1.10\" # S3 native state locking\n\n  required_providers {\n    aws = {\n      source  = \"hashicorp/aws\"\n      version = \"~> 6.0\"\n    }\n  }\n}\n```\n\n`infra/live/global/budget/terragrunt.hcl`\n\n```hcl\ninclude \"root\" {\n  path = find_in_parent_folders(\"root.hcl\")\n}\n\nterraform {\n  source = \"${get_repo_root()}/infra/modules/budget\"\n}\n\ninputs = {\n  limit_usd = \"5\"\n  email     = get_env(\"BUDGET_EMAIL\") # keep your email out of git\n}\n```\n\nReview, then apply:\n\n```\n> Review infra/modules/budget and infra/live/global/budget against the aws-terraform skill.\n> Use the ecc:code-reviewer agent. Don't change anything; list findings.\n```\n\n```bash\nexport BUDGET_EMAIL=\"you@example.com\"\naws sso login --profile learn-admin\ncd infra/live/global/budget\nterragrunt backend bootstrap   # creates the state bucket (versioned, encrypted, private)\nterragrunt plan\nterragrunt apply\n```\n\nThen open the state bucket in the S3 console and find\n`live/global/budget/terraform.tfstate`. Run `terragrunt plan` again in one terminal and\nlook quickly: you may catch the `.tflock` object that native locking writes while a run holds\nthe lock.\n\nBudgets without actions are free, so this unit stays up permanently.\n\n---\n\n## Check yourself (no Claude)\n\n1. Why is a 4-hour SSO session safer than an access key when an AI agent runs shell commands for you?\n2. Terragrunt had to create the state bucket *outside* of Terraform. Why can't the state bucket live in the state it stores?\n3. What does `use_lockfile = true` protect against, and what did people use before it?\n4. Why do modules here never contain a `provider` block?\n5. You added `default_tags`. Why might Cost Explorer still not show cost by `Project`?\n6. Where should each of these go: CLAUDE.md, a rule, a skill, or a hook?\n   (a) \"Region is us-east-1\" (b) \"Never run terraform destroy\" (c) \"How to write a Terragrunt unit\" (d) \"Functions must be \u003c 50 lines\"\n\nThen: `/ecc:aside grade my answers: ...`\n\n## Stretch goals\n\n- Add a `cost-anomaly` unit: `aws_ce_anomaly_monitor` + `aws_ce_anomaly_subscription` (email, threshold $3).\n- Add a second permission set `LearnReadOnly` and use it while reviewing, so `plan` works but nothing can change.\n- Read the Terragrunt \"Stacks\" docs (`terragrunt.stack.hcl`) and decide whether you'd use them here. Write the decision as an ADR with `ecc:architecture-decision-records`.\n\n## Teardown\n\nNothing to tear down. Keep the budget and the state bucket for the rest of the tutorial.\n\n## Sources\n\n- Terragrunt: migrating from root `terragrunt.hcl`: \u003chttps://docs.terragrunt.com/migrate/migrating-from-root-terragrunt-hcl/>\n- Terragrunt CLI redesign (`run --all`): \u003chttps://terragrunt.gruntwork.io/docs/migrate/cli-redesign>\n- AWS free tier changes (July 2025): \u003chttps://infratally.com/articles/aws-free-tier-2026/>\n- ECC README, rules section: \u003chttps://github.com/affaan-m/ECC#readme>\n"},{"id":"m02","file":"02-p1-serverless-api.md","title":"Module 2 · P1 · Serverless URL shortener (Go)","md":"# Module 2 · P1 · Serverless URL shortener (Go)\n\nA URL shortener is small enough to finish in a weekend and touches the core serverless\ntrio: **Lambda + API Gateway + DynamoDB**. P2 puts a frontend on it and P4 adds auth, so\nkeep it running after you finish.\n\n**Time:** 1–2 weekends · **Cost:** ≈ $0 idle, cents under use\n\n## What you'll learn\n\n| AWS | ECC |\n|---|---|\n| Lambda execution model: cold starts, handler lifecycle, `provided.al2023` custom runtime, arm64 | `/ecc:plan` with a real requirements list, and rejecting parts of a plan |\n| IAM execution roles: trust policy vs permission policy, least privilege to one table ARN | `/ecc:go-test` TDD loop (table-driven tests, fakes behind interfaces) |\n| API Gateway **HTTP API** vs REST API vs Lambda Function URL | `/ecc:go-review` in a fresh subagent |\n| DynamoDB key design, conditional writes, atomic counters, TTL | `ecc:security-reviewer` on IAM + input validation |\n| CloudWatch Logs retention, Logs Insights, metric alarms | `ecc:verification-loop` PASS/FAIL before commit |\n| Throttling as both a security and a cost control | `/ecc:learn-eval` and growing your `aws-terraform` skill |\n\n## Architecture\n\n```\n            ┌──────────────────────────── AWS us-east-1 ───────────────────────────┐\n client ──► │ API Gateway HTTP API ──► Lambda (Go, arm64) ──► DynamoDB \"links\"     │\n  curl      │  POST /links             bootstrap binary       pk: code (S)         │\n  browser   │  GET  /{code}  (301)     role: Get/Put/Update   url, createdAt,      │\n            │  GET  /links/{code}       on table ARN only     clicks, expiresAt    │\n            │  stage throttling                │                (TTL)              │\n            │                                  ▼                                   │\n            │                       CloudWatch Logs (7d) ──► alarm on Errors ► SNS │\n            └──────────────────────────────────────────────────────────────────────┘\n```\n\n## Cost\n\n| Resource | Pricing | Here |\n|---|---|---|\n| Lambda | Always free: 1M requests + 400k GB-s/month | $0 |\n| DynamoDB on-demand | Always free 25 GB storage; on-demand requests are cents per million | ~$0 |\n| HTTP API | ~$1.00 per million requests (no free tier on post-2025 accounts) | ~$0 |\n| CloudWatch Logs | 5 GB ingest free | $0 with 7-day retention |\n\nIdle cost is zero, so you can leave P1 deployed for P2 and P4.\n\n## Repo layout\n\n```\napps/p1-shortener/\n├── go.mod\n├── cmd/lambda/main.go             # wiring only: build deps, lambda.Start(handler)\n├── internal/links/                # domain: code generation, URL validation, service\n│   ├── service.go\n│   └── service_test.go\n├── internal/httpapi/              # API Gateway v2 event \u003c-> service\n│   ├── handler.go\n│   └── handler_test.go\n├── internal/store/dynamo.go       # implements links.Store with aws-sdk-go-v2\n└── build.sh\ninfra/modules/\n├── dynamodb-table/\n├── lambda-function/               # reused in P3\n└── http-api/\ninfra/live/dev/p1-shortener/\n├── table/terragrunt.hcl\n├── fn/terragrunt.hcl              # depends on table\n└── api/terragrunt.hcl             # depends on fn\n```\n\n---\n\n## M1 · Plan (30 min)\n\n```\n/ecc:plan P1 URL shortener in apps/p1-shortener (Go) with infra under infra/.\nRequirements:\n- POST /links {url} -> 201 {code, shortUrl}. Only http/https URLs, max 2048 chars.\n- GET /{code} -> 301 to the URL, increments a click counter atomically.\n- GET /links/{code} -> {url, clicks, createdAt}.\n- Codes: 7 chars base62, random; retry on collision using a conditional write.\n- Links expire after 30 days via DynamoDB TTL.\n- Lambda provided.al2023 on arm64, HTTP API, DynamoDB on-demand.\n- Follow the aws-terraform skill. Cost must stay ~$0.\nBefore the step list, compare HTTP API vs REST API vs Lambda Function URL for this.\n```\n\nRead the plan critically:\n\n- Did it pick the right API option and say why? (HTTP API: cheaper, simpler, JWT authorizers built in, which you'll need in P4. REST API: usage plans, API keys, request validation, WAF directly. Function URL: free but no routing/throttling/authorizers.)\n- Did it put the store behind an interface so the handler is testable without AWS?\n- Is anything hourly-billed? It shouldn't be.\n\nAsk for an ADR of the API decision: `use ecc:architecture-decision-records to write docs/adr/0001-http-api.md`.\n\n## M2 · DynamoDB table (you write it)\n\nWrite `infra/modules/dynamodb-table` yourself: inputs `project`, `env`, `name`,\n`hash_key`, `ttl_attribute` (nullable); `billing_mode = \"PAY_PER_REQUEST\"`; outputs\n`name` and `arn`. Then:\n\n```\n> Review infra/modules/dynamodb-table with the ecc:code-reviewer agent against the aws-terraform skill.\n```\n\nUnit `infra/live/dev/p1-shortener/table/terragrunt.hcl`:\n\n```hcl\ninclude \"root\" {\n  path = find_in_parent_folders(\"root.hcl\")\n}\n\nterraform {\n  source = \"${get_repo_root()}/infra/modules/dynamodb-table\"\n}\n\ninputs = {\n  name          = \"links\"\n  hash_key      = \"code\"\n  ttl_attribute = \"expiresAt\"\n}\n```\n\nApply it, then play with the table **by hand** before writing any Go. This is where\nDynamoDB starts to make sense:\n\n```bash\nt=learn-aws-dev-links\naws dynamodb put-item --table-name \"$t\" \\\n  --item '{\"code\":{\"S\":\"abc1234\"},\"url\":{\"S\":\"https://aws.amazon.com\"},\"clicks\":{\"N\":\"0\"}}'\n# conditional write: run it twice, the second fails with ConditionalCheckFailedException\naws dynamodb put-item --table-name \"$t\" --condition-expression \"attribute_not_exists(code)\" \\\n  --item '{\"code\":{\"S\":\"abc1234\"},\"url\":{\"S\":\"https://x.com\"}}'\n# atomic counter\naws dynamodb update-item --table-name \"$t\" --key '{\"code\":{\"S\":\"abc1234\"}}' \\\n  --update-expression \"ADD clicks :one\" --expression-attribute-values '{\":one\":{\"N\":\"1\"}}' \\\n  --return-values UPDATED_NEW\n```\n\n(Single quotes keep the JSON literal in bash. For bigger items, use `--item file://item.json`.)\n\n## M3 · Go code, test-first\n\n```\n/ecc:go-test implement internal/links: Service with Create(ctx, rawURL) and Resolve(ctx, code),\nbehind a Store interface. Table-driven tests first with an in-memory fake store. Cases:\nvalid https URL, ftp URL rejected, javascript: URL rejected, >2048 chars rejected,\ncollision on first two attempts then success, unknown code -> ErrNotFound.\n```\n\nWatch the red → green cycle. Then the HTTP adapter:\n\n```\n/ecc:go-test implement internal/httpapi: a handler for events.APIGatewayV2HTTPRequest\nthat routes POST /links, GET /{code}, GET /links/{code} to links.Service. Test each route,\nbad JSON -> 400, ErrNotFound -> 404, unexpected error -> 500 with no internal details in the body.\n```\n\nWrite `internal/store/dynamo.go` **yourself** (aws-sdk-go-v2 `dynamodb` +\n`feature/dynamodb/attributevalue`). It is the part that teaches you the API: `PutItem`\nwith `ConditionExpression`, `GetItem`, `UpdateItem` with `ADD`, mapping\n`*types.ConditionalCheckFailedException` to a domain error with `errors.As`.\n\nUseful skills to pull in by name: `ecc:golang-patterns`, `ecc:golang-testing`,\n`ecc:hexagonal-architecture` (the Store interface is a port, Dynamo is an adapter).\n\n`build.sh`:\n\n```bash\n#!/usr/bin/env bash\nset -euo pipefail\ncd \"$(dirname \"$0\")\"\n# env vars set inline apply to this one command only\nGOOS=linux GOARCH=arm64 CGO_ENABLED=0 \\\n  go build -tags lambda.norpc -trimpath -ldflags '-s -w' -o dist/bootstrap ./cmd/lambda\n```\n\nThe binary **must** be named `bootstrap` for the `provided.al2023` runtime. `lambda.norpc`\ndrops the legacy RPC code path you don't need.\n\n## M4 · Lambda + HTTP API infra\n\n`infra/modules/lambda-function` should create: log group (7-day retention), IAM role\nwith a trust policy for `lambda.amazonaws.com`, a permission policy built from an input\nlist of statements, and the function (`runtime = \"provided.al2023\"`,\n`architectures = [\"arm64\"]`, `handler = \"bootstrap\"`, code from `archive_file` over an\ninput `source_dir`). Outputs: `function_name`, `function_arn`, `invoke_arn`, `role_arn`.\n\nThe trickiest part of `http-api` is the permission that lets API Gateway invoke Lambda:\n\n```hcl\nresource \"aws_apigatewayv2_api\" \"this\" {\n  name          = \"${var.project}-${var.env}-${var.name}\"\n  protocol_type = \"HTTP\"\n}\n\nresource \"aws_apigatewayv2_integration\" \"lambda\" {\n  api_id                 = aws_apigatewayv2_api.this.id\n  integration_type       = \"AWS_PROXY\"\n  integration_uri        = var.lambda_invoke_arn\n  payload_format_version = \"2.0\"\n}\n\nresource \"aws_apigatewayv2_route\" \"routes\" {\n  for_each  = toset(var.routes) # [\"POST /links\", \"GET /{code}\", \"GET /links/{code}\"]\n  api_id    = aws_apigatewayv2_api.this.id\n  route_key = each.value\n  target    = \"integrations/${aws_apigatewayv2_integration.lambda.id}\"\n}\n\nresource \"aws_apigatewayv2_stage\" \"default\" {\n  api_id      = aws_apigatewayv2_api.this.id\n  name        = \"$default\"\n  auto_deploy = true\n\n  default_route_settings {\n    throttling_burst_limit = 20 # protects your wallet as much as your service\n    throttling_rate_limit  = 10\n  }\n}\n\nresource \"aws_lambda_permission\" \"apigw\" {\n  statement_id  = \"AllowHttpApiInvoke\"\n  action        = \"lambda:InvokeFunction\"\n  function_name = var.lambda_function_name\n  principal     = \"apigateway.amazonaws.com\"\n  source_arn    = \"${aws_apigatewayv2_api.this.execution_arn}/*/*\"\n}\n```\n\nThe `fn` unit wires the table in through a dependency:\n\n```hcl\ninclude \"root\" {\n  path = find_in_parent_folders(\"root.hcl\")\n}\n\nterraform {\n  source = \"${get_repo_root()}/infra/modules/lambda-function\"\n}\n\ndependency \"table\" {\n  config_path = \"../table\"\n  mock_outputs = {\n    name = \"mock-table\"\n    arn  = \"arn:aws:dynamodb:us-east-1:111111111111:table/mock-table\"\n  }\n}\n\ninputs = {\n  name       = \"shortener\"\n  source_dir = \"${get_repo_root()}/apps/p1-shortener/dist\"\n  env_vars   = { TABLE_NAME = dependency.table.outputs.name }\n  policy_statements = [{\n    actions   = [\"dynamodb:GetItem\", \"dynamodb:PutItem\", \"dynamodb:UpdateItem\"]\n    resources = [dependency.table.outputs.arn]\n  }]\n}\n```\n\nDeploy and test:\n\n```bash\napps/p1-shortener/build.sh\ncd infra/live/dev/p1-shortener\nterragrunt run --all plan\nterragrunt run --all apply\napi=$(cd api && terragrunt output -raw api_endpoint)   # output from the http-api module\ncode=$(curl -s -X POST \"$api/links\" -H \"content-type: application/json\" \\\n  -d '{\"url\":\"https://aws.amazon.com/lambda/\"}' | jq -r .code)\ncurl -s -i \"$api/$code\"          # expect 301 + Location header\ncurl -s \"$api/links/$code\" | jq  # clicks should be 1\n```\n\nNote how `run --all` applies `table → fn → api` in dependency order.\n\n## M5 · Review\n\n```\n/ecc:go-review\n```\n\nThen a security pass. This is where AWS-specific problems surface:\n\n```\n> Use the ecc:security-reviewer agent on apps/p1-shortener and infra/modules/{lambda-function,http-api}.\n> Focus: IAM least privilege, open-redirect abuse, input validation, error leakage, abuse/cost controls.\n```\n\nThings it should find (if it doesn't, ask about them):\n\n- A URL shortener is an **open redirect by design**. Mitigations: scheme allow-list,\n  optional domain deny-list, rate limiting (you have stage throttling).\n- Does the role allow `dynamodb:*` or `Resource: \"*\"`? It shouldn't.\n- Do 500 responses leak AWS error messages?\n- Is `logs:CreateLogGroup` granted even though Terraform already made the group? Remove it,\n  so a typo'd function name can't create unmanaged, never-expiring log groups.\n\nFix findings, then add each lesson to `.claude/skills/aws-terraform/SKILL.md`.\n\n## M6 · Observability\n\n1. Log JSON with `log/slog` (`slog.NewJSONHandler(os.Stdout, nil)`): include `code`,\n   `route`, `status`, `latency_ms`, the request ID.\n2. CloudWatch → Logs Insights on `/aws/lambda/learn-aws-dev-shortener`:\n\n   ```\n   fields @timestamp, route, status, latency_ms\n   | filter status >= 400\n   | stats count() by route, status\n   ```\n\n3. Add to the `lambda-function` module: an SNS topic + email subscription and a\n   `aws_cloudwatch_metric_alarm` on `AWS/Lambda` `Errors` `Sum > 0` over 5 minutes.\n4. Break it on purpose (bad `TABLE_NAME`), watch the alarm fire, read the logs, fix.\n5. `> Use ecc:silent-failure-hunter on apps/p1-shortener`. Does any path swallow a DynamoDB error and return 404?\n\n## M7 · Verify, commit, learn\n\n```\necc:verification-loop          # build, vet, tests + coverage, security grep, diff review\ngit add -A; git commit -m \"feat(p1): serverless url shortener\"\n/ecc:learn-eval                # save what's reusable (e.g. \"Go Lambda build on Windows\")\n```\n\n---\n\n## Check yourself (no Claude)\n\n1. What's the difference between the role's **trust policy** and its **permission policy**? Which one did `aws_lambda_permission` modify, and on which resource?\n2. Why does `GET /{code}` use `UpdateItem ADD` instead of read-increment-write?\n3. Your conditional `PutItem` fails. Which exception, and why is retrying with a new code safe?\n4. TTL deletes are \"eventually\" processed. What does that mean for `Resolve` on an expired item?\n5. Name two things a REST API gives you that an HTTP API doesn't.\n6. Where does a cold start's time go for a Go `provided.al2023` function, and why is it small?\n7. Why is a 7-day log retention a cost decision?\n\n## Stretch goals\n\n- Enable X-Ray active tracing on the function and API; find the DynamoDB subsegment.\n- Add `GET /links?owner=…` with a GSI on `owner`. You'll need it in P4.\n- Benchmark arm64 vs x86_64 duration and price with the same payload.\n- Swap HTTP API for a Function URL in a branch; list what you lost.\n\n## Teardown\n\nKeep P1 running; it costs ~$0 idle and P2/P4 build on it. To remove it:\n\n```bash\ncd infra/live/dev/p1-shortener\nterragrunt run --all destroy\n```\n"},{"id":"m03","file":"03-p2-static-frontend.md","title":"Module 3 · P2 · Static frontend on the edge (Next.js)","md":"# Module 3 · P2 · Static frontend on the edge (Next.js)\n\nGive P1 a web UI: a Next.js static export served from a **private** S3 bucket through\n**CloudFront**. Small app, lots of AWS concepts: origins, origin access control, cache\nbehavior, edge functions, CORS.\n\n**Time:** 1 weekend · **Cost:** ≈ $0 (CloudFront always-free: 1 TB out + 10M requests/month)\n\n## What you'll learn\n\n| AWS | ECC |\n|---|---|\n| S3 as a private origin; why not the S3 website endpoint | Adding the `typescript` rule pack only when you need it |\n| CloudFront distributions, origins, behaviors, cache policies, TTLs | `frontend-design` skill for UI direction |\n| Origin Access Control (OAC) + bucket policy with `AWS:SourceArn` | `/ecc:react-test` (Testing Library, Vitest) |\n| CloudFront Functions (viewer-request rewrite) | `/ecc:react-review` + `ecc:typescript-reviewer` |\n| CORS on API Gateway HTTP APIs, and who actually enforces it | ECC's bundled **chrome-devtools MCP** for a real browser check + Lighthouse |\n| Cache-Control strategy and invalidations | Terragrunt cross-project `dependency` |\n\n## Architecture\n\n```\n                  ┌──────────────── CloudFront distribution ─────────────────┐\n browser ───────► │ viewer-request: CF Function (append index.html)          │\n                  │ default behavior ──► S3 origin (private, OAC, SigV4)     │\n                  │ /_next/static/*  ──► same origin, 1-year immutable cache │\n                  └──────────────────────────────────────────────────────────┘\n     │\n     │ fetch() with Origin: https://dxxxx.cloudfront.net\n     ▼\n P1 HTTP API (CORS allow_origins = [cloudfront domain]) ──► Lambda ──► DynamoDB\n```\n\n## Cost\n\n| Resource | Here |\n|---|---|\n| S3 | A few MB, cents at most |\n| CloudFront | Always free up to 1 TB/month + 10M requests; PriceClass_100 |\n| Invalidations | First 1,000 paths/month free; `/*` counts as one path |\n\n## Steps\n\n### M1 · Plan + rules\n\n```bash\ncp -R ~/.claude/plugins/cache/ecc/ecc/2.2.3/rules/typescript .claude/rules/ecc/\n```\n\n```\n/ecc:plan P2: Next.js static export in apps/p2-web that calls the P1 API.\n- Home page: form to shorten a URL, shows the short link and a copy button.\n- /stats?code=… page: shows url, clicks, createdAt from GET /links/{code}.\n- next.config: output 'export', trailingSlash true. API base URL from NEXT_PUBLIC_API_URL at build time.\n- Infra: private S3 bucket + CloudFront with OAC, a CloudFront Function for index.html\n  rewrites, PriceClass_100, managed cache policies. P1's HTTP API gets CORS for the\n  CloudFront domain only.\nExplain why the S3 static website endpoint is NOT used.\n```\n\nThings to check in the plan: dynamic routes like `/s/[code]` don't work with\n`output: 'export'` unless every code is known at build time. That's why stats use a query\nstring. Did the plan notice?\n\n### M2 · UI, test-first\n\nUse the `frontend-design` skill for direction, then:\n\n```\n/ecc:react-test build the shorten form: validates URL client-side, calls POST /links,\nshows the result, handles 400 and network errors. Mock fetch in tests.\n```\n\n```\n/ecc:react-test build /stats: reads ?code, calls GET /links/{code}, renders loading,\nnot-found, and error states.\n```\n\n### M3 · Infra: bucket + distribution\n\nWrite `infra/modules/static-site`. Key resources:\n\n```hcl\nresource \"aws_s3_bucket\" \"site\" {\n  bucket        = \"${var.project}-${var.env}-${var.name}-${data.aws_caller_identity.me.account_id}\"\n  force_destroy = true\n}\n\nresource \"aws_s3_bucket_public_access_block\" \"site\" {\n  bucket                  = aws_s3_bucket.site.id\n  block_public_acls       = true\n  block_public_policy     = true\n  ignore_public_acls      = true\n  restrict_public_buckets = true\n}\n\nresource \"aws_cloudfront_origin_access_control\" \"site\" {\n  name                              = \"${var.project}-${var.env}-${var.name}\"\n  origin_access_control_origin_type = \"s3\"\n  signing_behavior                  = \"always\"\n  signing_protocol                  = \"sigv4\"\n}\n\ndata \"aws_iam_policy_document\" \"site\" {\n  statement {\n    actions   = [\"s3:GetObject\"]\n    resources = [\"${aws_s3_bucket.site.arn}/*\"]\n    principals {\n      type        = \"Service\"\n      identifiers = [\"cloudfront.amazonaws.com\"]\n    }\n    condition {\n      test     = \"StringEquals\"\n      variable = \"AWS:SourceArn\"\n      values   = [aws_cloudfront_distribution.site.arn]\n    }\n  }\n}\n\nresource \"aws_cloudfront_function\" \"index_rewrite\" {\n  name    = \"${var.project}-${var.env}-${var.name}-index\"\n  runtime = \"cloudfront-js-2.0\"\n  publish = true\n  code    = \u003c\u003c-JS\n    function handler(event) {\n      var req = event.request;\n      if (req.uri.endsWith('/')) { req.uri += 'index.html'; }\n      else if (!req.uri.includes('.')) { req.uri += '/index.html'; }\n      return req;\n    }\n  JS\n}\n```\n\nThen the distribution: S3 origin with `origin_access_control_id`, default behavior with\nthe managed **CachingOptimized** cache policy, the function on `viewer-request`,\n`viewer_protocol_policy = \"redirect-to-https\"`, `default_root_object = \"index.html\"`,\n`price_class = \"PriceClass_100\"`, a `custom_error_response` for 403/404 → `/404.html`,\nand the managed **SecurityHeadersPolicy** response headers policy. Look up managed\npolicy IDs with `data \"aws_cloudfront_cache_policy\"` by name rather than hardcoding them.\n\nReview before applying, with security focus:\n\n```\n> Use ecc:security-reviewer on infra/modules/static-site. Can anything read the bucket except this distribution?\n```\n\n### M4 · CORS on P1 (cross-project dependency)\n\nAdd `cors_origins` to the `http-api` module:\n\n```hcl\ncors_configuration {\n  allow_origins = var.cors_origins\n  allow_methods = [\"GET\", \"POST\"]\n  allow_headers = [\"content-type\"]\n  max_age       = 3600\n}\n```\n\nIn `infra/live/dev/p1-shortener/api/terragrunt.hcl`:\n\n```hcl\ndependency \"web\" {\n  config_path  = \"../../p2-web/site\"\n  mock_outputs = { domain_name = \"example.cloudfront.net\" }\n}\n\ninputs = {\n  # ...existing inputs\n  cors_origins = [\"https://${dependency.web.outputs.domain_name}\", \"http://localhost:3000\"]\n}\n```\n\nThe dependency direction matters: P1's API depends on P2's distribution, never the\nreverse, so there's no cycle. The web app gets the API URL at **build** time, not from\nTerraform.\n\n### M5 · Deploy\n\n```bash\nroot=$(git rev-parse --show-toplevel)\nlive=$root/infra/live/dev\n\n(cd \"$live/p2-web/site\" && terragrunt apply)\nbucket=$(cd \"$live/p2-web/site\" && terragrunt output -raw bucket_name)\ndist=$(cd \"$live/p2-web/site\" && terragrunt output -raw distribution_id)\n(cd \"$live/p1-shortener/api\" && terragrunt apply)             # picks up the CORS origin\nexport NEXT_PUBLIC_API_URL=$(cd \"$live/p1-shortener/api\" && terragrunt output -raw api_endpoint)\n\ncd \"$root/apps/p2-web\"\npnpm build                                                    # -> out/\n# long cache for fingerprinted assets, no-cache for HTML\naws s3 sync out/_next/static \"s3://$bucket/_next/static\" --cache-control \"public,max-age=31536000,immutable\"\naws s3 sync out \"s3://$bucket\" --delete --exclude \"_next/static/*\" --cache-control \"no-cache\"\n# MSYS_NO_PATHCONV stops Git Bash from turning \"/*\" into a Windows path\nMSYS_NO_PATHCONV=1 aws cloudfront create-invalidation --distribution-id \"$dist\" --paths \"/*\"\n```\n\nPut this in `apps/p2-web/deploy.sh` once it works.\n\n### M6 · Verify in a real browser with ECC's chrome-devtools MCP\n\nECC bundles a Chrome DevTools MCP server. Ask:\n\n```\n> Use the chrome-devtools MCP: open the CloudFront URL, shorten https://aws.amazon.com,\n> open the stats page for the new code, then list console errors and the network requests\n> to the API with their status and CORS headers. Then run a Lighthouse audit.\n```\n\nThen break CORS on purpose (remove the CloudFront origin, apply) and look at what the\nbrowser reports versus what `curl` reports. curl still works, because CORS is enforced\nby browsers, not by the API.\n\n### M7 · Review, verify, learn\n\n```\n/ecc:react-review\necc:verification-loop\ngit commit -m \"feat(p2): static frontend on cloudfront\"\n/ecc:learn-eval\n```\n\n---\n\n## Check yourself (no Claude)\n\n1. OAC vs the legacy OAI vs a public bucket website endpoint: which can serve a private bucket, and why can't the website endpoint use OAC?\n2. What is in CloudFront's cache key by default with CachingOptimized? What breaks if you add all query strings to it?\n3. Why can fingerprinted `/_next/static/*` files be cached for a year but HTML can't?\n4. CORS: who sends the preflight, who answers it, who enforces the result?\n5. A user sees an old version after deploy. List three possible causes.\n6. Why must an ACM certificate for CloudFront be created in `us-east-1`?\n\n## Stretch goals\n\n- **Single origin, no CORS:** add the HTTP API as a second CloudFront origin with a `/links*` behavior using the managed `CachingDisabled` + `AllViewerExceptHostHeader` policies. Delete the CORS config. Compare the two designs in an ADR.\n- Custom domain: Route 53 hosted zone ($0.50/month) + ACM cert in us-east-1 + alias record.\n- Add a Playwright smoke test with `ecc:e2e-testing` that runs against the deployed URL.\n\n## Teardown\n\nIdle cost is ~$0, so keep it if you like. Otherwise:\n\n1. In `infra/live/dev/p1-shortener/api/terragrunt.hcl`, remove the `dependency \"web\"` block\n   and the CloudFront origin from `cors_origins`, then `terragrunt apply` that unit. (If you\n   destroy P2 first, the dependency has no outputs to read and P1's api unit errors.)\n2. Then:\n\n   ```bash\n   cd infra/live/dev/p2-web && terragrunt run --all destroy\n   ```\n\nCloudFront distributions take several minutes to disable and delete. That's normal.\n"},{"id":"m04","file":"04-p3-event-pipeline.md","title":"Module 4 · P3 · Event-driven bulk import (TypeScript)","md":"# Module 4 · P3 · Event-driven bulk import (TypeScript)\n\nAdd **bulk import** to the shortener: upload a CSV of URLs and an asynchronous pipeline\ncreates the short links. This is where AWS gets interesting. Delivery is\nat-least-once, failures are partial, and nothing returns a stack trace to you.\n\n**Time:** 2 weekends · **Cost:** ≈ $0 (S3, EventBridge default bus, SQS, SNS, Lambda all within free usage)\n\n## What you'll learn\n\n| AWS | ECC |\n|---|---|\n| S3 presigned URLs (upload without proxying bytes through Lambda) | `/ecc:orch-refine-code` on **infrastructure**, verified by an empty `terragrunt plan` |\n| S3 → EventBridge notifications, event patterns, rules, targets | `/ecc:orch-add-feature` end to end with its two gates |\n| SQS: visibility timeout, DLQ + `maxReceiveCount`, redrive | `ecc:silent-failure-hunter` on async code |\n| Lambda event source mappings, batch size, `ReportBatchItemFailures` | `/ecc:orch-fix-defect` on a bug you trigger on purpose |\n| Idempotency under at-least-once delivery | `/ecc:checkpoint` across a multi-day task |\n| DynamoDB `BatchWriteItem` and `UnprocessedItems` | `/ecc:save-session` / `/ecc:resume-session` |\n| SNS fan-out, Powertools for AWS Lambda (TypeScript) | |\n| (Stretch) Step Functions | |\n\n## Architecture\n\n```\n web/curl ─POST /imports─► HTTP API (P1) ─► Lambda \"presign\" (TS)\n                                              │ 1. put imports{id, status:PENDING}\n                                              │ 2. return presigned PUT url\n web/curl ─PUT csv────────► S3 imports bucket  incoming/{id}.csv\n                                │ (EventBridge notifications on)\n                                ▼\n                       EventBridge default bus\n                       rule: source=aws.s3, detail-type=\"Object Created\",\n                             bucket=imports, key prefix \"incoming/\"\n                                │\n                                ▼\n                       SQS imports-queue ──(3 failed receives)──► SQS imports-dlq ─► alarm\n                                │ event source mapping, batch 1, ReportBatchItemFailures\n                                ▼\n                       Lambda \"importer\" (TS)\n                         stream CSV → validate rows → BatchWriteItem into links (P1 table)\n                         update imports{id} counts/status\n                                │\n                                ▼\n                       SNS import-results ──► email\n```\n\nWhy EventBridge in the middle instead of S3 → SQS directly? Content filtering on any\nevent field, several targets per event, archive and replay. You'll compare both in the\ncheck-yourself questions.\n\n## Steps\n\n### M1 · Refactor first: make `lambda-function` multi-runtime\n\nP1's module hardcodes `provided.al2023`. Generalize it **without changing P1**:\n\n```\n/ecc:orch-refine-code generalize infra/modules/lambda-function: runtime, handler,\narchitecture, timeout, memory become variables with P1's current values as defaults.\nAlso generalize infra/modules/http-api so routes map to different Lambda functions\n(a map of route_key -> {invoke_arn, function_name}), one integration + permission per function.\nSuccess criterion: `terragrunt run --all plan` in infra/live/dev/p1-shortener shows\n\"No changes.\" for every unit.\n```\n\nThis is the most useful habit in IaC: a refactor is proven by an **empty plan**, just as a\ncode refactor is proven by green tests. Use `moved {}` blocks if any resource address\nchanges.\n\n### M2 · Plan the feature\n\n```bash\n# skip if you already copied it in P2\n[ -d .claude/rules/ecc/typescript ] || cp -R ~/.claude/plugins/cache/ecc/ecc/2.2.3/rules/typescript .claude/rules/ecc/\n```\n\n```\n/ecc:orch-add-feature P3 bulk import for the P1 shortener, code in apps/p3-importer (TypeScript,\nesbuild-bundled, latest Node.js Lambda runtime, arm64), infra in infra/live/dev/p3-importer.\n- POST /imports on the existing P1 HTTP API -> Lambda \"presign\": creates an imports record\n  {importId, status: PENDING, createdAt} and returns a presigned S3 PUT URL (5 min) for\n  incoming/{importId}.csv, content-type text/csv, max 1 MB.\n- S3 bucket with EventBridge notifications. Rule on Object Created under incoming/ -> SQS queue.\n- SQS queue: visibility timeout 6x the importer timeout, DLQ after 3 receives, DLQ depth alarm.\n- Lambda \"importer\": event source mapping batch size 1 with ReportBatchItemFailures.\n  Streams the CSV (one URL per row, optional header), validates each URL with the same rules\n  as P1, writes links with BatchWriteItem in chunks of 25 retrying UnprocessedItems with backoff,\n  updates imports{importId} with created/rejected counts and status DONE or FAILED,\n  publishes a summary to an SNS topic.\n- Must be idempotent: the same S3 object delivered twice must not create duplicate links.\n- Use Powertools for AWS Lambda (TypeScript): Logger, and the batch utility for partial failures.\n- GET /imports/{importId} returns the record.\n```\n\n**Gate 1:** read the plan. Push back on at least one thing. For example: how exactly is\nidempotency achieved? (Options: deterministic link codes derived from `importId + row`, a\nconditional write on the imports record's status, or Powertools' idempotency utility.\nAsk for the trade-offs.)\n\nLet the pipeline run TDD (the `tdd-workflow` skill, via the orchestrator) and its review\nstep. **Gate 2:** read the diff before allowing the commit.\n\n### M3 · Write the event pattern yourself\n\nThe EventBridge rule is short and teaches a lot, so write it yourself:\n\n```hcl\nresource \"aws_cloudwatch_event_rule\" \"csv_uploaded\" {\n  name = \"${var.project}-${var.env}-csv-uploaded\"\n  event_pattern = jsonencode({\n    source        = [\"aws.s3\"]\n    \"detail-type\" = [\"Object Created\"]\n    detail = {\n      bucket = { name = [aws_s3_bucket.imports.id] }\n      object = { key = [{ prefix = \"incoming/\" }] }\n    }\n  })\n}\n```\n\nThen the pieces people forget, which the security reviewer should catch if you don't:\n\n- `aws_s3_bucket_notification` with `eventbridge = true`. Without it, nothing is emitted.\n- An **SQS queue policy** allowing `events.amazonaws.com` to `sqs:SendMessage`, conditioned\n  on `aws:SourceArn` = the rule ARN.\n- The importer role: `sqs:ReceiveMessage/DeleteMessage/GetQueueAttributes` on the queue,\n  `s3:GetObject` on `incoming/*`, `dynamodb:BatchWriteItem` on the links table,\n  `dynamodb:UpdateItem` on the imports table, `sns:Publish` on the topic. Nothing else.\n\n### M4 · Deploy and watch it work\n\n```bash\ncd infra/live/dev/p3-importer && terragrunt run --all apply\napi=$(cd ../p1-shortener/api && terragrunt output -raw api_endpoint)\n\n# get a presigned URL, upload the CSV straight to S3, then poll the import record\nr=$(curl -s -X POST \"$api/imports\")\nimport_id=$(jq -r .importId \u003c\u003c\u003c\"$r\")\nupload_url=$(jq -r .uploadUrl \u003c\u003c\u003c\"$r\")\ncurl -s -X PUT -H \"content-type: text/csv\" --data-binary @sample.csv \"$upload_url\"\ncurl -s \"$api/imports/$import_id\" | jq\n```\n\nFollow one import through the console: S3 object → EventBridge rule metrics\n(`MatchedEvents`, `Invocations`) → SQS `NumberOfMessagesReceived` → Lambda logs → the\nimports record → email.\n\n### M5 · Hunt silent failures\n\n```\n> Use ecc:silent-failure-hunter on apps/p3-importer.\n```\n\nAsync code fails quietly. Typical findings: `UnprocessedItems` ignored after retries,\n`catch` that logs and returns success (message deleted, data lost), a rejected row\ncounted as created, SNS publish failure marking the import FAILED after links were\nwritten.\n\n### M6 · Break it on purpose, then fix it with the defect pipeline\n\n1. Generate a CSV with 20,000 rows (above the 1 MB limit you set, so first raise the limit\n   in a branch). Upload it.\n2. Watch: the importer hits its timeout → message becomes visible again → reprocessed →\n   after 3 receives lands in the DLQ → alarm email.\n3. Check DynamoDB: did retries create duplicates? If your idempotency is right, no.\n4. Fix it properly:\n\n```\n/ecc:orch-fix-defect importer times out on large CSVs; retries reprocess from the start.\nExpected: large files are processed in resumable chunks and never duplicate links.\n```\n\nThe orchestrator first writes a failing regression test that reproduces the bug, then fixes\nit. Options it may propose: checkpoint progress (row offset) on the imports record, split\nthe file into chunk messages, or move to Step Functions (see stretch goals).\n\n5. Redrive the DLQ: SQS console → `imports-dlq` → **Start DLQ redrive**. Watch the message\n   succeed this time.\n\nLong task? Use `/ecc:checkpoint` before M6 and `/ecc:save-session` at the end of the day.\n\n### M7 · Verify, learn\n\n```\necc:verification-loop\n/ecc:learn-eval      # good candidates: \"SQS visibility vs Lambda timeout\", \"EventBridge S3 pattern\"\n```\n\nAdd the queue-policy and visibility-timeout rules to your `aws-terraform` skill.\n\n---\n\n## Check yourself (no Claude)\n\n1. Why must the SQS visibility timeout be larger than the Lambda timeout? What happens if it isn't?\n2. With batch size 10 and no `ReportBatchItemFailures`, one bad message fails. What happens to the other 9?\n3. Name two ways to make \"the same S3 object delivered twice\" harmless.\n4. S3 → SQS directly vs S3 → EventBridge → SQS: give one reason for each.\n5. What does `BatchWriteItem` do with items it couldn't write, and does it throw?\n6. Why does the presigned URL approach scale better than POSTing the CSV body to Lambda through API Gateway? (Hint: payload limits.)\n7. Your DLQ has 5 messages. Before redriving, what do you check?\n\n## Stretch goals\n\n- **Step Functions:** replace the importer with a Standard workflow: `ValidateFile` → Distributed Map over CSV rows from S3 (batching 100) → `UpdateImport` → `Notify`. Compare cost (4,000 state transitions/month free) and debuggability with the SQS design. Write an ADR.\n- Enable an EventBridge **archive** on the default bus for this rule's pattern and **replay** yesterday's uploads.\n- Add Powertools Tracer + X-Ray and look at the trace across presign → S3 → importer.\n- Add a second rule target: a \"virus scan\" stub Lambda. Fan-out without touching the importer.\n\n## Teardown\n\nIdle cost ~$0. To remove:\n\n```bash\ncd infra/live/dev/p3-importer && terragrunt run --all destroy\n```\n\nRemove the `/imports` routes from P1's api unit first if they reference P3 outputs.\n"},{"id":"m05","file":"05-p4-auth-and-cicd.md","title":"Module 5 · P4 · Auth and CI/CD","md":"# Module 5 · P4 · Auth and CI/CD\n\nTwo production concerns that most tutorials skip: **who is calling** (Cognito + JWT\nauthorizers) and **who is deploying** (GitHub Actions assuming an AWS role via OIDC, with\nno stored keys). Both are really IAM and trust-policy lessons.\n\n**Time:** 2 weekends · **Cost:** ≈ $0 (Cognito Essentials includes 10,000 MAU free; GitHub Actions free minutes on private repos)\n\n## What you'll learn\n\n| AWS | ECC |\n|---|---|\n| Cognito user pools, app clients, managed login, OAuth 2.0 authorization code + PKCE | `/ecc:orch-change-feature`: changing working behavior (anonymous → owned links) |\n| ID token vs access token, scopes, JWT validation | `ecc:security-reviewer` + `/ecc:santa-loop` on trust policies |\n| HTTP API **JWT authorizers** (issuer, audience) | `/ecc:pr`, `/ecc:review-pr`, `/ecc:code-review` on a GitHub PR |\n| IAM OIDC identity providers, `AssumeRoleWithWebIdentity` | `/ecc:security-scan` after adding CI secrets/config |\n| Trust policy conditions on `sub` (repo, branch, environment) | |\n| Separating plan (read-only) and apply (write) roles | |\n\n## Part A · Cognito + JWT authorizer\n\n### Architecture\n\n```\n browser (P2) ──► Cognito managed login (authorization code + PKCE)\n      │                  │ tokens (id, access, refresh)\n      │◄─────────────────┘\n      │ Authorization: Bearer \u003caccess token>\n      ▼\n HTTP API ── JWT authorizer (issuer = user pool, audience = app client id)\n      │  claims.sub available to Lambda as event.requestContext.authorizer.jwt.claims\n      ▼\n Lambda (P1) ── links now have owner = sub; GET /links lists only mine (GSI owner)\n```\n\n### Steps\n\n1. **Plan the change** (this alters behavior of a working feature, so use the change pipeline):\n\n   ```\n   /ecc:orch-change-feature P1 links get an owner. POST /links and GET /links (list mine)\n   require a valid Cognito access token via an HTTP API JWT authorizer; GET /{code} stays public.\n   Owner = token sub. Add a GSI owner-createdAt to the links table. Existing anonymous links keep\n   working for redirects but are not listed. P2 gets sign-in via Cognito managed login with\n   authorization code + PKCE (no client secret), tokens kept in memory, not localStorage.\n   ```\n\n   At Gate 1, ask: \"Why access token and not ID token for the API? Why PKCE and not the\n   implicit flow?\" Make sure you agree with the answers before approving.\n\n2. **Write the authorizer yourself** in the `http-api` module:\n\n   ```hcl\n   resource \"aws_apigatewayv2_authorizer\" \"jwt\" {\n     count            = var.jwt == null ? 0 : 1\n     api_id           = aws_apigatewayv2_api.this.id\n     authorizer_type  = \"JWT\"\n     identity_sources = [\"$request.header.Authorization\"]\n     name             = \"cognito\"\n     jwt_configuration {\n       issuer   = var.jwt.issuer   # https://cognito-idp.us-east-1.amazonaws.com/\u003cpool id>\n       audience = var.jwt.audience # [app client id]\n     }\n   }\n   ```\n\n   Routes then need `authorization_type = \"JWT\"` and `authorizer_id`, per route. Model\n   that as a per-route flag rather than all-or-nothing.\n\n3. **Cognito module:** user pool (email sign-in, MFA optional TOTP, password policy),\n   a public app client (`generate_secret = false`,\n   `allowed_oauth_flows = [\"code\"]`, callback URLs = CloudFront + localhost), a managed\n   login domain prefix. Create a test user with\n   `aws cognito-idp admin-create-user`.\n\n4. **Prove it in the browser** with the chrome-devtools MCP: sign in, create a link, inspect\n   the `Authorization` header, decode the token at a JWT decoder, and find `sub`,
